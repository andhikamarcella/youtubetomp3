services:
  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    environment:
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET}
      TURN_REALM: ${TURN_REALM}
    command:
      - -c
      - /etc/coturn/turnserver.conf
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro

