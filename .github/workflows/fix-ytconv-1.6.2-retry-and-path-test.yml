name: Fix YTConv 1.6.2 retry and portable path test

on:
  push:
    branches:
      - agent/ytconv-1.6.2-youtube-output-fix
    paths:
      - .github/workflows/fix-ytconv-1.6.2-retry-and-path-test.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ytconv-1.6.2-youtube-output-fix
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Apply the retry and canonical-path fixes
        run: |
          python3 <<'PY'
          from pathlib import Path

          downloader = Path('cli/src/downloader.js')
          text = downloader.read_text(encoding='utf-8')
          old = """    '--retry-sleep', retrySleep, '--retry-sleep', `fragment:${retrySleep.replace(/^[^:]+:/u, '')}`,
    '--retry-sleep', `file_access:${retrySleep.replace(/^[^:]+:/u, '')}`, '--geo-bypass',"""
          new = """    '--retry-sleep', retrySleep, '--retry-sleep', `fragment:${retrySleep}`,
    '--retry-sleep', `file_access:${retrySleep}`, '--geo-bypass',"""
          if old not in text:
              raise SystemExit('retry-sleep replacement target was not found')
          downloader.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_file = Path('cli/test/youtube-output.test.js')
          text = test_file.read_text(encoding='utf-8')
          old = """  assert.equal(result.outputPath, existing);
  assert.deepEqual(result.outputPaths, [existing]);
  assert.equal(result.fileCount, 1);"""
          new = """  const canonicalExisting = await fs.realpath(existing);
  assert.equal(result.outputPath, canonicalExisting);
  assert.deepEqual(result.outputPaths, [canonicalExisting]);
  assert.equal(result.fileCount, 1);"""
          if old not in text:
              raise SystemExit('portable path assertion target was not found')
          test_file.write_text(text.replace(old, new, 1), encoding='utf-8')

          retry_test = Path('cli/test/release-1.3.test.js')
          text = retry_test.read_text(encoding='utf-8')
          old = """  assert.ok(sleeps.every((value) => !/fragment::|file_access::/u.test(value)), sleeps.join(','));
  assert.ok(sleeps.some((value) => value === 'fragment:linear=1::2'));"""
          new = """  assert.ok(sleeps.every((value) => !/^(?:fragment|file_access)::/u.test(value)), sleeps.join(','));
  assert.ok(sleeps.includes('linear=1::2'));
  assert.ok(sleeps.includes('fragment:linear=1::2'));
  assert.ok(sleeps.includes('file_access:linear=1::2'));"""
          if old not in text:
              raise SystemExit('retry test replacement target was not found')
          retry_test.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Run the complete CLI test suite
        working-directory: cli
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test
      - name: Commit the verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cli/src/downloader.js cli/test/youtube-output.test.js cli/test/release-1.3.test.js
          git commit -m "fix(cli): preserve retry expressions and canonicalize path assertions"
          git push origin HEAD:agent/ytconv-1.6.2-youtube-output-fix
