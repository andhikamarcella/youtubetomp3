name: PR Migrate YTConv 1.7.0

on:
  pull_request:
    branches:
      - release/ytconv-web
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: pr-migrate-ytconv-1.7.0
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ github.head_ref == 'trigger/ytconv-1.7.0-migration' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/ytconv-web
          path: controller

      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/ytconv-1.7.0
          fetch-depth: 0
          path: target

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: target/cli/package-lock.json

      - name: Run deterministic migration
        run: python3 controller/.github/scripts/migrate-ytconv-1.7.0.py target

      - name: Commit synchronized release source
        working-directory: target
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Release source is already synchronized.'
          else
            git commit -m 'release: synchronize YTConv 1.7.0'
            git push origin HEAD:release/ytconv-1.7.0
          fi

      - name: Run full npm package gate
        working-directory: target/cli
        run: |
          npm ci --ignore-scripts
          npm run prepack

      - name: Report success
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: target
        run: |
          gh issue create --title 'YTConv 1.7.0 migration: success' --body "Repository migration, version synchronization, documentation validation, and full npm prepack completed successfully on \`release/ytconv-1.7.0\`. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Report failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: target
        run: |
          gh issue create --title 'YTConv 1.7.0 migration: failure' --body "The one-time 1.7.0 migration failed. Inspect: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
