name: Publish YTConv 1.6.5 GitHub Release only

on:
  push:
    branches:
      - codex/perbaiki-semua-fungsi-tombol
    paths:
      - ".github/release-markers/ytconv-1.6.5-release-only"

permissions:
  actions: read
  contents: write

concurrency:
  group: ytconv-1.6.5-release-only
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VERSION: 1.6.5
      TAG: ytconv-v1.6.5
      SOURCE_REF: release/ytconv-1.6.5-packages
      SOURCE_SHA: 98c79c16b377857e4e8a7874be47e9361d41f1dc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 98c79c16b377857e4e8a7874be47e9361d41f1dc
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify exact source and correct release tag
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(node -p "require('./cli/package.json').version")" = "$VERSION"
          git fetch origin --tags --force
          CURRENT=$(git rev-list -n 1 "$TAG" 2>/dev/null || true)
          if [ "$CURRENT" != "$SOURCE_SHA" ]; then
            echo "Correcting $TAG from ${CURRENT:-missing} to $SOURCE_SHA"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -fa "$TAG" "$SOURCE_SHA" -m "YTConv $VERSION"
            git push --force origin "refs/tags/$TAG"
          fi
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG" --force
          test "$(git rev-list -n 1 "$TAG")" = "$SOURCE_SHA"
      - name: Locate successful native package matrix
        id: matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DATA=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ytconv-packages.yml/runs" \
            -f branch="$SOURCE_REF" -f head_sha="$SOURCE_SHA" -f event=push -f status=success -f per_page=20)
          RUN_ID=$(printf '%s' "$DATA" | jq -r '.workflow_runs[0].id // empty')
          test -n "$RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Download and consolidate verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ steps.matrix.outputs.run_id }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/native-artifacts"
          RELEASE="$RUNNER_TEMP/release-assets"
          rm -rf "$ROOT" "$RELEASE"
          mkdir -p "$ROOT" "$RELEASE"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --dir "$ROOT"
          for REQUIRED in \
            'YTConv-1.6.5-Setup-x64.exe' \
            'YTConv-1.6.5-portable-win-x64.zip' \
            'YTConv-1.6.5-debug.apk' \
            'YTConv-1.6.5-release-unsigned.apk' \
            'YTConv-Android-1.6.5-source.tar.gz' \
            'ytconv_1.6.5_amd64.deb' \
            'ytconv_1.6.5_arm64.deb' \
            'ytconv-1.6.5-1.x86_64.rpm' \
            'ytconv-1.6.5-1.aarch64.rpm' \
            'ytconv-1.6.5-1-x86_64.pkg.tar.zst' \
            'ytconv-1.6.5-1-aarch64.pkg.tar.zst' \
            'ytconv-1.6.5-r0.apk' \
            'YTConv-1.6.5-x86_64.AppImage' \
            'ytconv_1.6.5_amd64.snap' \
            'YTConv-1.6.5.flatpak' \
            'ytconv_1.6.5_all-termux.deb'; do
            FILE=$(find "$ROOT" -type f -name "$REQUIRED" -print -quit)
            test -n "$FILE"
            test -s "$FILE"
          done
          while IFS= read -r -d '' FILE; do
            BASE=$(basename "$FILE")
            case "$BASE" in SHA256SUMS*.txt) continue ;; esac
            if [ -e "$RELEASE/$BASE" ]; then
              test "$(sha256sum "$RELEASE/$BASE" | cut -d ' ' -f 1)" = "$(sha256sum "$FILE" | cut -d ' ' -f 1)"
            else
              cp "$FILE" "$RELEASE/$BASE"
            fi
          done < <(find "$ROOT" -type f -print0)
      - name: Build npm tarball SBOM and checksums
        working-directory: cli
        run: |
          npm install -g npm@11.18.0
          npm ci --ignore-scripts
          RELEASE="$RUNNER_TEMP/release-assets"
          npm sbom --omit=dev --sbom-format cyclonedx > "$RELEASE/ytconv-$VERSION.cdx.json"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/ytconv-pack.json"
          TARBALL=$(node -e "const p=require('$RUNNER_TEMP/ytconv-pack.json')[0];process.stdout.write(require('path').join('$RUNNER_TEMP',p.filename))")
          cp "$TARBALL" "$RELEASE/ytconv-$VERSION.tgz"
          cd "$RELEASE"
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Create release and upload every asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE="$RUNNER_TEMP/release-assets"
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          YTConv 1.6.5 adds a Windows EXE installer and portable ZIP, Android APK builds and source archive, DEB/RPM/Arch packages for x86_64 and ARM64, Alpine APK, AppImage, Snap, Flatpak, Termux DEB, portable Linux archives, Nix metadata, consolidated SHA-256 checksums, CycloneDX SBOM, and the exact npm tarball.

          iSH and Alpine install/update paths are repaired and synchronized to 1.6.5. The npm package remains CLI-only, ISC licensed, and has no install lifecycle scripts.

          `ytconv@1.6.5` is published as npm `latest`; its registry tarball was verified against the exact locally built package. The Android release APK is unsigned, while the debug APK is intended for direct testing. Store acceptance is not claimed.
          NOTES
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "YTConv 1.6.5 — Native Packages" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "YTConv 1.6.5 — Native Packages" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          fi
          while IFS= read -r -d '' ASSET; do
            echo "Uploading $(basename "$ASSET")"
            gh release upload "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          done < <(find "$RELEASE" -maxdepth 1 -type f -print0 | sort -z)
      - name: Verify release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force
          test "$(git rev-list -n 1 "$TAG")" = "$SOURCE_SHA"
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')" -ge 20
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease --jq '.tagName == env.TAG and (.isDraft|not) and (.isPrerelease|not)' | grep -qx true
