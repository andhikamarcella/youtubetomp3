name: Prepare YTConv 1.6.6 Socket Hardening

on:
  push:
    branches:
      - agent/ytconv-1.6.6-socket-hardening
    paths:
      - .github/scripts/prepare-ytconv-1.6.6.mjs
      - .github/scripts/finalize-ytconv-1.6.6.mjs
      - .github/workflows/prepare-ytconv-1.6.6.yml
  pull_request:
    branches:
      - release/ytconv-1.6.5-packages
    paths:
      - .github/scripts/prepare-ytconv-1.6.6.mjs
      - .github/scripts/finalize-ytconv-1.6.6.mjs
      - .github/workflows/prepare-ytconv-1.6.6.yml
      - cli/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-ytconv-1.6.6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/ytconv-1.6.6-socket-hardening
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply deterministic 1.6.6 migration
        run: |
          node .github/scripts/prepare-ytconv-1.6.6.mjs
          node .github/scripts/finalize-ytconv-1.6.6.mjs
      - name: Regenerate exact npm lockfile without lifecycle scripts
        working-directory: cli
        run: npm install --package-lock-only --ignore-scripts
      - name: Install and validate
        working-directory: cli
        run: |
          npm ci --ignore-scripts
          npm run check
          npm run typecheck
          npm test
          npm run check:ish
          npm run security
          test "$(node ./bin/ytconv.js --version)" = "1.6.6"
          test "$(cat ish/VERSION)" = "1.6.6"
          ! grep -R "from 'which'\|from \"which\"\|figlet/importable\|from 'figlet'" src bin test
          node --input-type=module - <<'NODE'
          const manifest = JSON.parse(await (await import('node:fs/promises')).readFile('./package.json', 'utf8'));
          if (manifest.version !== '1.6.6') throw new Error(`wrong version: ${manifest.version}`);
          for (const dependency of ['which', 'figlet']) {
            if (manifest.dependencies?.[dependency]) throw new Error(`forbidden dependency: ${dependency}`);
          }
          for (const lifecycle of ['preinstall', 'install', 'postinstall']) {
            if (manifest.scripts?.[lifecycle]) throw new Error(`forbidden lifecycle script: ${lifecycle}`);
          }
          NODE
      - name: Commit prepared release changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cli packaging android-app flake.nix
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "harden ytconv 1.6.6 dependencies"
          git push origin HEAD:agent/ytconv-1.6.6-socket-hardening
