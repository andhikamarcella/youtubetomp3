name: Add YTConv YouTube public-client fallback

on:
  push:
    branches:
      - agent/ytconv-1.6.2-youtube-output-fix
    paths:
      - .github/workflows/fix-ytconv-1.6.2-youtube-public-client.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ytconv-1.6.2-youtube-output-fix
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Implement bot-challenge fallback and tests
        run: |
          python3 <<'PY'
          from pathlib import Path

          downloader = Path('cli/src/downloader.js')
          text = downloader.read_text(encoding='utf-8')
          old = """  formatVideoSelector,
  isYouTubeMusicUrl,
  videoContainerArgs,
"""
          new = """  formatVideoSelector,
  isYouTubeMusicUrl,
  isYouTubeUrl,
  videoContainerArgs,
"""
          if text.count(old) != 1:
              raise SystemExit('YouTube import target was not found exactly once')
          text = text.replace(old, new, 1)

          old = """  const proxy = optionValue(options, 'proxy', 'YTCONV_PROXY');
  if (proxy) args.push('--proxy', proxy);
  return args;
}"""
          new = """  const proxy = optionValue(options, 'proxy', 'YTCONV_PROXY');
  if (proxy) args.push('--proxy', proxy);
  const youtubePlayerClient = optionValue(options, 'youtubePlayerClient', 'YTCONV_YOUTUBE_PLAYER_CLIENT');
  if (youtubePlayerClient) args.push('--extractor-args', `youtube:player_client=${youtubePlayerClient}`);
  return args;
}"""
          if text.count(old) != 1:
              raise SystemExit('common extractor target was not found exactly once')
          text = text.replace(old, new, 1)

          old = """export async function downloadMedia({ ytDlp, ytDlpPath, options, onProgress, onLog, signal }) {
  const forceVideo = process.env.YTCONV_FORCE_VIDEO === '1';
  const forceGallery = process.env.YTCONV_FORCE_GALLERY === '1';
  const mayUseGallery = options.mode !== 'audio' && !forceVideo;
  if (mayUseGallery && (forceGallery || isGalleryPreferredUrl(options.url))) {
    onLog?.('Using the gallery engine for images, carousels, Stories, Reels, and mixed posts.', false);
    return downloadGallery({ url: options.url, cookieConfig: options.cookieConfig, outputDirectory: options.outputDirectory, onProgress, onLog, signal });
  }
  try {
    return await downloadWithYtDlp({ ytDlp, ytDlpPath, options, onProgress, onLog, signal });
  } catch (ytDlpError) {
    if (!mayUseGallery) throw ytDlpError;
    onLog?.('yt-dlp could not handle this media; trying the gallery engine...', true);
    try {
      return await downloadGallery({ url: options.url, cookieConfig: options.cookieConfig, outputDirectory: options.outputDirectory, onProgress, onLog, signal });
    } catch (galleryError) {
      throw new Error(`${ytDlpError instanceof Error ? ytDlpError.message : String(ytDlpError)} Gallery fallback: ${galleryError instanceof Error ? galleryError.message : String(galleryError)}`);
    }
  }
}
"""
          new = """function isYouTubeBotChallenge(error) {
  const message = error instanceof Error ? error.message : String(error ?? '');
  return /sign in to confirm you(?:'|’)?re not a bot|not a bot|protect our community/iu.test(message);
}

export async function downloadMedia({ ytDlp, ytDlpPath, options, onProgress, onLog, signal }) {
  const forceVideo = process.env.YTCONV_FORCE_VIDEO === '1';
  const forceGallery = process.env.YTCONV_FORCE_GALLERY === '1';
  const mayUseGallery = options.mode !== 'audio' && !forceVideo;
  if (mayUseGallery && (forceGallery || isGalleryPreferredUrl(options.url))) {
    onLog?.('Using the gallery engine for images, carousels, Stories, Reels, and mixed posts.', false);
    return downloadGallery({ url: options.url, cookieConfig: options.cookieConfig, outputDirectory: options.outputDirectory, onProgress, onLog, signal });
  }

  let primaryError;
  try {
    return await downloadWithYtDlp({ ytDlp, ytDlpPath, options, onProgress, onLog, signal });
  } catch (ytDlpError) {
    primaryError = ytDlpError;
  }

  if (
    isYouTubeUrl(options.url)
    && !options.youtubePlayerClient
    && isYouTubeBotChallenge(primaryError)
  ) {
    onLog?.('YouTube challenged the default public client; retrying with the Android VR public client...', true);
    try {
      return await downloadWithYtDlp({
        ytDlp,
        ytDlpPath,
        options: { ...options, youtubePlayerClient: 'android_vr' },
        onProgress,
        onLog,
        signal,
      });
    } catch (publicClientError) {
      const primaryMessage = primaryError instanceof Error ? primaryError.message : String(primaryError);
      const fallbackMessage = publicClientError instanceof Error ? publicClientError.message : String(publicClientError);
      primaryError = new Error(`${primaryMessage} Public YouTube client fallback: ${fallbackMessage}`);
    }
  }

  if (!mayUseGallery) throw primaryError;
  onLog?.('yt-dlp could not handle this media; trying the gallery engine...', true);
  try {
    return await downloadGallery({ url: options.url, cookieConfig: options.cookieConfig, outputDirectory: options.outputDirectory, onProgress, onLog, signal });
  } catch (galleryError) {
    throw new Error(`${primaryError instanceof Error ? primaryError.message : String(primaryError)} Gallery fallback: ${galleryError instanceof Error ? galleryError.message : String(galleryError)}`);
  }
}
"""
          if text.count(old) != 1:
              raise SystemExit('downloadMedia target was not found exactly once')
          downloader.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('cli/test/youtube-output.test.js')
          text = tests.read_text(encoding='utf-8')
          old = """if (process.env.YTCONV_TEST_BEHAVIOR === 'metadata-only') {
  fs.writeFileSync(path.join(process.cwd(), 'metadata.info.json'), '{}');
  process.exit(0);
}
if (process.env.YTCONV_TEST_BEHAVIOR === 'zero-output') process.exit(0);
"""
          new = """if (process.env.YTCONV_TEST_BEHAVIOR === 'metadata-only') {
  fs.writeFileSync(path.join(process.cwd(), 'metadata.info.json'), '{}');
  process.exit(0);
}
if (process.env.YTCONV_TEST_BEHAVIOR === 'bot-fallback') {
  const extractorIndex = args.indexOf('--extractor-args');
  const extractorArgs = extractorIndex >= 0 ? args[extractorIndex + 1] : '';
  if (extractorArgs === 'youtube:player_client=android_vr') {
    const target = path.join(process.cwd(), 'public-client.mp4');
    fs.writeFileSync(target, 'verified public client mp4');
    console.log('ytconv-file:' + target);
    process.exit(0);
  }
  console.error("ERROR: [youtube] Sign in to confirm you’re not a bot. This helps protect our community.");
  process.exit(1);
}
if (process.env.YTCONV_TEST_BEHAVIOR === 'zero-output') process.exit(0);
"""
          if text.count(old) != 1:
              raise SystemExit('fake runner target was not found exactly once')
          text = text.replace(old, new, 1)

          marker = """test('yt-dlp exit zero without a real mode-matching file is rejected', async (t) => {"""
          addition = """test('YouTube bot challenge retries once with the Android VR public client', async (t) => {
  const { directory, marker, runner } = await fakeRunner(t, 'bot-fallback');
  const result = await downloadMedia({
    ytDlp: runner,
    options: baseOptions({ outputDirectory: directory }),
  });
  assert.equal(result.fileCount, 1);
  assert.equal(path.basename(result.outputPath), 'public-client.mp4');
  const calls = (await fs.readFile(marker, 'utf8')).trim().split('\\n').map(JSON.parse);
  assert.equal(calls.length, 2);
  assert.equal(calls[0].includes('--extractor-args'), false);
  const index = calls[1].indexOf('--extractor-args');
  assert.equal(calls[1][index + 1], 'youtube:player_client=android_vr');
});

"""
          if text.count(marker) != 1:
              raise SystemExit('test insertion marker was not found exactly once')
          tests.write_text(text.replace(marker, addition + marker, 1), encoding='utf-8')
          PY
      - name: Verify complete CLI tests
        working-directory: cli
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test
      - name: Commit verified fallback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cli/src/downloader.js cli/test/youtube-output.test.js
          git commit -m "fix(cli): retry YouTube bot challenge with public client"
          git push origin HEAD:agent/ytconv-1.6.2-youtube-output-fix
