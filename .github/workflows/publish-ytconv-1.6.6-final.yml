name: Publish final YTConv 1.6.6 zero-dependency release

on:
  push:
    branches:
      - codex/perbaiki-semua-fungsi-tombol
    paths:
      - ".github/release-markers/publish-ytconv-1.6.6-zero-deps-final"

permissions:
  actions: read
  contents: write
  id-token: write
  issues: write

concurrency:
  group: publish-final-ytconv-1.6.6
  cancel-in-progress: false

jobs:
  publish:
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VERSION: 1.6.6
      TAG: ytconv-v1.6.6
      SOURCE_SHA: 9e34bf39cded0415e7fe181f149873693bdce561
      NATIVE_RUN: 30987893498
    steps:
      - name: Checkout immutable final source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9e34bf39cded0415e7fe181f149873693bdce561
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install exact development graph without lifecycle scripts
        working-directory: cli
        run: |
          npm install -g npm@11.18.0
          npm ci --ignore-scripts

      - name: Verify immutable zero-dependency source identity
        working-directory: cli
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          test "$(node -p "require('./package.json').license")" = "ISC"
          test "$(cat ish/VERSION)" = "$VERSION"
          node --input-type=module - <<'NODE'
          const fs = await import('node:fs/promises');
          const manifest = JSON.parse(await fs.readFile('./package.json', 'utf8'));
          for (const field of ['dependencies', 'optionalDependencies', 'peerDependencies']) {
            if (Object.keys(manifest[field] || {}).length) {
              throw new Error(`${field} must be empty: ${JSON.stringify(manifest[field])}`);
            }
          }
          for (const hook of ['preinstall', 'install', 'postinstall']) {
            if (manifest.scripts?.[hook]) throw new Error(`forbidden install hook: ${hook}`);
          }
          if (manifest.securityCapabilities?.telemetry !== false) throw new Error('telemetry must remain disabled');
          const { resolveYouTubeOutputPolicy } = await import('./src/youtube-output.js');
          const music = resolveYouTubeOutputPolicy({
            url: 'https://music.youtube.com/watch?v=x',
            requestedMode: 'auto',
            requestedVideoFormat: 'auto',
          });
          const video = resolveYouTubeOutputPolicy({
            url: 'https://youtu.be/x',
            requestedMode: 'auto',
            requestedVideoFormat: 'auto',
          });
          if (music.mode !== 'audio') throw new Error(`YouTube Music AUTO failed: ${JSON.stringify(music)}`);
          if (video.mode !== 'video' || video.videoFormat !== 'mp4') {
            throw new Error(`YouTube AUTO failed: ${JSON.stringify(video)}`);
          }
          NODE

      - name: Run exact release validation
        working-directory: cli
        run: |
          npm run check
          npm run typecheck
          npm test
          npm run check:ish
          PYTHONWARNINGS=error::ResourceWarning npm run test:ish
          npm run security

      - name: Download validated native artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/native-artifacts"
          RELEASE="$RUNNER_TEMP/release-assets"
          rm -rf "$ROOT" "$RELEASE"
          mkdir -p "$ROOT" "$RELEASE"
          gh run download "$NATIVE_RUN" --repo "$GITHUB_REPOSITORY" --dir "$ROOT"
          for REQUIRED in \
            'YTConv-1.6.6-Setup-x64.exe' \
            'YTConv-1.6.6-portable-win-x64.zip' \
            'YTConv-1.6.6-debug.apk' \
            'YTConv-1.6.6-release-unsigned.apk' \
            'YTConv-Android-1.6.6-source.tar.gz' \
            'ytconv_1.6.6_amd64.deb' \
            'ytconv_1.6.6_arm64.deb' \
            'ytconv-1.6.6-1.x86_64.rpm' \
            'ytconv-1.6.6-1.aarch64.rpm' \
            'ytconv-1.6.6-1-x86_64.pkg.tar.zst' \
            'ytconv-1.6.6-1-aarch64.pkg.tar.zst' \
            'ytconv-1.6.6-r0.apk' \
            'YTConv-1.6.6-x86_64.AppImage' \
            'ytconv_1.6.6_amd64.snap' \
            'YTConv-1.6.6.flatpak' \
            'ytconv_1.6.6_all-termux.deb'; do
            FILE=$(find "$ROOT" -type f -name "$REQUIRED" -print -quit)
            test -n "$FILE"
            test -s "$FILE"
          done
          while IFS= read -r -d '' FILE; do
            BASE=$(basename "$FILE")
            case "$BASE" in SHA256SUMS*.txt) continue ;; esac
            if [ -e "$RELEASE/$BASE" ]; then
              test "$(sha256sum "$RELEASE/$BASE" | cut -d ' ' -f 1)" = "$(sha256sum "$FILE" | cut -d ' ' -f 1)"
            else
              cp "$FILE" "$RELEASE/$BASE"
            fi
          done < <(find "$ROOT" -type f -print0)

      - name: Build exact npm tarball and SBOM
        id: package
        working-directory: cli
        run: |
          RELEASE="$RUNNER_TEMP/release-assets"
          npm sbom --omit=dev --sbom-format cyclonedx > "$RELEASE/ytconv-$VERSION.cdx.json"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/ytconv-pack.json"
          SOURCE=$(node -e "const p=require('$RUNNER_TEMP/ytconv-pack.json')[0];process.stdout.write(require('path').join('$RUNNER_TEMP',p.filename))")
          cp "$SOURCE" "$RELEASE/ytconv-$VERSION.tgz"
          node - <<'NODE'
          const fs = require('node:fs');
          const pack = require(process.env.RUNNER_TEMP + '/ytconv-pack.json')[0];
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (Object.keys(manifest.dependencies || {}).length) throw new Error('runtime dependency graph is not empty');
          const bad = pack.files.filter((file) =>
            /(?:^|\/)node_modules(?:\/|$)/u.test(file.path)
            || /(?:^|\.)min\.(?:c?js|mjs)$/iu.test(file.path)
            || /\.(?:c?js|mjs)\.map$/iu.test(file.path)
            || /\.(?:exe|dll|dylib|so|node|wasm|jar|class)$/iu.test(file.path)
            || /\.(?:html|css|jsx|tsx)$/iu.test(file.path));
          if (bad.length) throw new Error(JSON.stringify(bad, null, 2));
          NODE
          SHA256=$(sha256sum "$RELEASE/ytconv-$VERSION.tgz" | cut -d ' ' -f 1)
          echo "tarball=$RELEASE/ytconv-$VERSION.tgz" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Create and verify consolidated SHA-256 checksums
        run: |
          cd "$RUNNER_TEMP/release-assets"
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Publish immutable npm tarball with provenance
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_SHA: ${{ env.SOURCE_SHA }}
        run: |
          if npm view "ytconv@$VERSION" version --prefer-online >/dev/null 2>&1; then
            echo "ytconv@$VERSION already exists; immutable publish is skipped."
          else
            test -n "${NODE_AUTH_TOKEN:-}"
            npm publish "${{ steps.package.outputs.tarball }}" --tag latest --access public --provenance
          fi

      - name: Verify npm latest and registry bytes
        working-directory: cli
        run: |
          READY=false
          for ATTEMPT in $(seq 1 30); do
            REGISTRY_VERSION=$(npm view ytconv@latest version --prefer-online 2>/dev/null || true)
            if [ "$REGISTRY_VERSION" = "$VERSION" ]; then READY=true; break; fi
            echo "Waiting for npm propagation ($ATTEMPT/30)..."
            sleep 5
          done
          test "$READY" = true
          URL=$(npm view "ytconv@$VERSION" dist.tarball --prefer-online)
          curl --fail --location --retry 5 "$URL" -o "$RUNNER_TEMP/ytconv-$VERSION.registry.tgz"
          test "$(sha256sum "$RUNNER_TEMP/ytconv-$VERSION.registry.tgz" | cut -d ' ' -f 1)" = "${{ steps.package.outputs.sha256 }}"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE="$RUNNER_TEMP/release-assets"
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          YTConv 1.6.6 is the zero-runtime-dependency Socket hardening release. React, Ink, Figlet, ws, which, and their transitive production graph were replaced by Node.js built-ins and internal executable resolution.

          The npm tarball rejects install lifecycle hooks, external runtime imports, minified JavaScript, source maps, native payloads, debug statements, dynamic evaluation, and shell execution. Legitimate downloader capabilities—network, constrained filesystem output, documented environment reads, URL constants, and argument-array child processes—remain restricted and documented.

          Assets include Windows EXE/ZIP, Android APK/source, DEB, RPM, Arch, Alpine APK, AppImage, Snap, Flatpak, Termux, ARM64 packages, portable archives, CycloneDX SBOM, exact npm tarball, and consolidated SHA-256 checksums. The Android release APK is unsigned; the debug APK is installable for testing.
          NOTES
          mapfile -d '' ASSETS < <(find "$RELEASE" -maxdepth 1 -type f -print0 | sort -z)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
              --title "YTConv 1.6.6 — Zero Runtime Dependencies" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
            gh release upload "$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" --latest \
              --title "YTConv 1.6.6 — Zero Runtime Dependencies" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Report success
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 183 --repo "$GITHUB_REPOSITORY" --body "✅ YTConv 1.6.6 zero-runtime-dependency release published. npm latest and registry bytes were verified; GitHub Release **ytconv-v1.6.6** contains native artifacts, SBOM, and SHA-256 checksums. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Report failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "YTConv 1.6.6 final publication failed" \
            --body "Final publication failed in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Do not claim success until npm latest, registry-byte verification, and GitHub Release creation complete." || true
