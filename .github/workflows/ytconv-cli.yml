name: Synchronize YTConv 1.6.5 generated source

on:
  push:
    branches:
      - release/ytconv-1.6.5-packages
    paths:
      - "cli/**"
      - "packaging/patch-core-and-lock.mjs"
      - "packaging/update-release-docs.mjs"
      - ".github/workflows/ytconv-cli.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ytconv-1.6.5-source-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/ytconv-1.6.5-packages
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - name: Synchronize generated release files
        run: |
          node packaging/patch-core-and-lock.mjs
          node packaging/update-release-docs.mjs
      - name: Commit deterministic generated source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cli/package-lock.json cli/ish/ytconv-core.py cli/ish/SHA256SUMS cli/docs cli/SECURITY.md cli/CHANGELOG.md
          if git diff --cached --quiet; then
            echo 'Generated source already synchronized.'
            exit 0
          fi
          git commit -m 'Synchronize YTConv 1.6.5 release documentation'
          git push origin HEAD:release/ytconv-1.6.5-packages
