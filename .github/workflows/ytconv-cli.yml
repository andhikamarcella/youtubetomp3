name: YTConv CLI Stable

on:
  push:
    branches:
      - release/ytconv-1.4.0
    paths:
      - "cli/**"
      - ".github/workflows/ytconv-cli.yml"
  pull_request:
    paths:
      - "cli/**"
      - ".github/workflows/ytconv-cli.yml"
  workflow_dispatch:

jobs:
  node-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install without bundled binaries
        run: npm install --ignore-scripts --omit=optional
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run unit tests
        run: npm test
      - name: Stable version and English help
        run: |
          test "$(node ./bin/ytconv.js --version)" = "1.4.0"
          node ./bin/ytconv.js --help | grep -q "Usage:"
          node ./bin/ytconv.js --help | grep -q "subtitles.*OFF"
          node ./bin/ytconv.js --help | grep -q "SponsorBlock.*OFF"
          node -e "import('./src/update.js').then(({releaseChannel,updateCommand}) => { if (releaseChannel('1.4.0') !== 'latest') process.exitCode=1; if (!updateCommand('1.4.0').includes('@latest')) process.exitCode=1; })"

  linux-full:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install full package
        run: npm install
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run unit tests
        run: npm test
      - name: Check native iSH compatibility and shell installers
        run: |
          npm run check:ish
          test "$(cat ish/VERSION)" = "1.4.0"
          mkdir -p /tmp/ytconv-ish
          cp ish/ytconv.py /tmp/ytconv-ish/ytconv.py
          cp ish/ytconv-beta.py /tmp/ytconv-ish/ytconv-core.py
          test "$(python3 /tmp/ytconv-ish/ytconv.py --version)" = "1.4.0"
      - name: Linux and SSH/headless smoke tests
        run: |
          node ./bin/ytconv.js --shell-info
          node ./bin/ytconv.js --self-test
          node ./bin/ytconv.js --examples
          printf '# comments are ignored\nhttps://example.com/a\nhttps://example.com/a\n' > /tmp/ytconv-links.txt
          node -e "import('./src/headless.js').then(async ({collectUrls}) => { const u = await collectUrls({batchFile:'/tmp/ytconv-links.txt'}); if (u.length !== 1) process.exitCode=1; console.log(u); })"
      - name: Verify stable defaults
        run: |
          node -e "import('./src/beta-defaults.js').then(({extractBetaToggles,applyBetaDefaults}) => import('./src/cli-options.js').then(({parseCliOptions}) => { const t=extractBetaToggles([]); const o=parseCliOptions(t.cleanArgs); applyBetaDefaults(o,t); console.log(o); if(o.subtitles || o.sponsorBlockMode!=='off' || o.archivePath) process.exitCode=1; }))"
      - name: Verify deterministic Void Linux detection
        run: |
          node -e "import('./src/linux-distro.js').then(({packageManagerFor, installPlanFor}) => { const m = packageManagerFor({id:'void'}); const p = installPlanFor(m); console.log({manager:m, plan:p}); if (m !== 'xbps' || !p.includes('xbps-install')) process.exitCode=1; })"
      - name: Verify media engines
        run: |
          test -x vendor/yt-dlp
          test -x vendor/gallery-dl
          test -x node_modules/ffmpeg-static/ffmpeg
          ./vendor/yt-dlp --version
          ./vendor/gallery-dl --version
          node -e "import('./src/dependencies.js').then(async ({inspectDependencies}) => { const d = await inspectDependencies({repair:false}); console.log(d); if (!d.ready) process.exitCode=1; })"
      - name: Preview npm stable package and English docs
        run: |
          npm pack --dry-run
          npm pack --json > package-preview.json
          grep -q '"version": "1.4.0"' package.json
          grep -q '"tag": "latest"' package.json
          grep -q 'docs/LINUX.md' package-preview.json
          grep -q 'Installing YTConv 1.4.0 on Linux' docs/LINUX.md
          grep -q 'Complete YTConv 1.4.0 Installation Guide' docs/INSTALL.md
          if grep -R -n -E 'Instalasi|Jalankan|Perbaikan|tidak ditemukan|berhasil dipasang' README.md docs scripts/install-*.sh scripts/install-windows.*; then
            echo "Non-English release documentation or installer text was found."
            exit 1
          fi
      - name: Simulate Termux npm stable install
        run: |
          TARBALL=$(npm pack --silent)
          rm -rf /tmp/ytconv-termux-sim
          mkdir -p /tmp/ytconv-termux-sim
          npm install --prefix /tmp/ytconv-termux-sim "$PWD/$TARBALL" --omit=optional --ignore-scripts
          test "$(node /tmp/ytconv-termux-sim/node_modules/ytconv/bin/ytconv.js --version)" = "1.4.0"

  windows-cmd-powershell:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install CLI dependencies
        shell: pwsh
        run: npm install
      - name: Check JavaScript syntax on Windows
        shell: pwsh
        run: npm run check
      - name: Run Windows unit tests
        shell: pwsh
        run: npm test
      - name: Verify stable updater avoids direct npm.cmd spawn
        shell: pwsh
        run: |
          node -e "import('./src/update.js').then(({selfUpdateInvocation}) => { const i = selfUpdateInvocation({currentVersion:'1.4.0',platform:'win32',env:{ComSpec:'cmd.exe'},execPath:'node.exe',npmCliPath:'npm-cli.js'}); console.log(i); if (i.command !== 'node.exe' || i.strategy !== 'node-npm-cli' || !i.args.includes('ytconv@latest')) process.exitCode = 1; })"
      - name: CMD stable user flow
        shell: cmd
        run: |
          node .\bin\ytconv.js --version
          node .\bin\ytconv.js --help
          node .\bin\ytconv.js --shell-info
          node .\bin\ytconv.js --self-test
          node .\bin\ytconv.js doctor
      - name: PowerShell stable user flow
        shell: pwsh
        run: |
          $version = node .\bin\ytconv.js --version
          if ($version -ne '1.4.0') { throw "Wrong version: $version" }
          node .\bin\ytconv.js --help | Select-String -SimpleMatch 'Usage:'
          Get-Content .\scripts\install-windows.ps1 | Select-String -SimpleMatch 'ytconv.cmd'
      - name: Verify Windows media engines
        shell: pwsh
        run: |
          if (-not (Test-Path "vendor/yt-dlp.exe")) { throw "yt-dlp.exe missing" }
          if (-not (Test-Path "vendor/gallery-dl.exe")) { throw "gallery-dl.exe missing" }
          if (-not (Test-Path "node_modules/ffmpeg-static/ffmpeg.exe")) { throw "ffmpeg.exe missing" }
          & "./vendor/yt-dlp.exe" --version
          & "./vendor/gallery-dl.exe" --version

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install stable package
        run: npm install
      - name: Check JavaScript syntax on macOS
        run: npm run check
      - name: Run macOS unit tests
        run: npm test
      - name: macOS stable smoke tests
        run: |
          test "$(node ./bin/ytconv.js --version)" = "1.4.0"
          node ./bin/ytconv.js --shell-info
          sh ./scripts/install-unix.sh --print-plan | grep -q 'brew'

  alpine-musl:
    runs-on: ubuntu-latest
    container: node:20-alpine
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - name: Install Alpine system engines
        run: apk add --no-cache python3 py3-pip ffmpeg bash
      - name: Install Python media engines
        run: python3 -m pip install --break-system-packages --no-cache-dir yt-dlp gallery-dl
      - name: Install JS package without glibc static FFmpeg
        run: npm install --ignore-scripts --omit=optional
      - name: Check Alpine JavaScript syntax
        run: npm run check
      - name: Run Alpine unit tests
        run: npm test
      - name: Verify Alpine stable version
        run: test "$(node ./bin/ytconv.js --version)" = "1.4.0"

  distro-installer-plans:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:bookworm-slim
          - ubuntu:24.04
          - fedora:latest
          - archlinux:base
          - opensuse/tumbleweed
          - alpine:3.20
          - gentoo/stage3:latest
          - nixos/nix:latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect distribution and print safe install plan
        run: |
          docker run --rm \
            -e YTCONV_INSTALL_DRY_RUN=1 \
            -v "$PWD/cli:/work:ro" \
            "${{ matrix.image }}" \
            sh /work/scripts/install-unix.sh --print-plan
