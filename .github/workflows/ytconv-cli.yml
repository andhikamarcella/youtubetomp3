name: YTConv CLI 1.7.2 Core and Compatibility

on:
  push:
    branches:
      - release/ytconv-1.7.2
    paths:
      - "cli/**"
      - "AGENTS.md"
      - "packaging/**"
      - "android-app/**"
      - "flake.nix"
      - ".github/workflows/ytconv-cli.yml"
      - ".github/workflows/ytconv-packages.yml"
  pull_request:
    paths:
      - "cli/**"
      - "AGENTS.md"
      - "packaging/**"
      - "android-app/**"
      - "flake.nix"
      - ".github/workflows/ytconv-cli.yml"
      - ".github/workflows/ytconv-packages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ytconv-cli-1.7.2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node: [22.14.0, 24, 26]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run docs:check
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:help-center
      - run: npm run security
      - name: Verify 1.7.2 identity, help center, repository, and AUTO policy
        run: |
          test "$(node ./bin/ytconv.js --version)" = "1.7.2"
          test "$(cat ish/VERSION)" = "1.7.2"
          node ./bin/ytconv-auth.js --help | grep -F 'cookies-browser'
          node ./bin/ytconv.js docs --list | grep -F 'Documentation Topics'
          node ./bin/ytconv.js docs migration | grep -F 'MIGRATION-1.7.2.md'
          node ./bin/ytconv.js about | grep -F 'YTConv 1.7.2'
          node ./bin/ytconv.js shortcuts | grep -F 'Ctrl+M'
          node ./bin/ytconv.js completion bash | grep -F 'docs about shortcuts'
          node --input-type=module - <<'NODE'
          const manifest = JSON.parse(await (await import('node:fs/promises')).readFile('./package.json', 'utf8'));
          if (manifest.version !== '1.7.2') throw new Error(manifest.version);
          if (manifest.license !== 'ISC') throw new Error(manifest.license);
          if (!manifest.repository.url.includes('andhikamarcella/YTConv')) throw new Error(manifest.repository.url);
          for (const dependency of ['commander', 'figlet', 'which', 'isexe']) {
            if (!manifest.dependencies[dependency]) throw new Error(`missing ${dependency}`);
          }
          if (manifest.scripts.preinstall || manifest.scripts.install || manifest.scripts.postinstall) {
            throw new Error('npm lifecycle install scripts are forbidden');
          }
          const { parseCliOptions } = await import('./src/cli-options.js');
          if (parseCliOptions([]).subtitles !== false) throw new Error('subtitles must default off');
          const { resolveYouTubeOutputPolicy } = await import('./src/youtube-output.js');
          const music = resolveYouTubeOutputPolicy({
            url: 'https://music.youtube.com/watch?v=x', requestedMode: 'auto', requestedVideoFormat: 'auto',
          });
          const video = resolveYouTubeOutputPolicy({
            url: 'https://youtu.be/x', requestedMode: 'auto', requestedVideoFormat: 'auto',
          });
          if (music.mode !== 'audio') throw new Error(`music AUTO: ${JSON.stringify(music)}`);
          if (video.mode !== 'video' || video.videoFormat !== 'mp4') throw new Error(`video AUTO: ${JSON.stringify(video)}`);
          NODE

  desktop:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run docs:check
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:help-center
      - run: npm run check:ish
        if: runner.os != 'Windows'
      - name: Run iSH tests with resource warnings as errors
        if: runner.os != 'Windows'
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: npm run test:ish
      - name: Windows CMD and PowerShell smoke tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ((node .\bin\ytconv.js --version) -ne '1.7.2') { throw 'wrong version' }
          node .\bin\ytconv-auth.js --help
          node .\bin\ytconv.js docs --list
          node .\bin\ytconv.js about
          node .\bin\ytconv.js shortcuts
          node .\bin\ytconv.js quickstart
          cmd.exe /d /c "node .\bin\ytconv.js --version"

  npm-package-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Inspect and install exact npm tarball without scripts
        run: |
          npm pack --json --dry-run --ignore-scripts > package-preview.json
          node - <<'NODE'
          const preview = require('./package-preview.json')[0];
          const paths = preview.files.map(file => file.path);
          const forbidden = paths.filter(value => /\.(?:html|css|jsx|tsx)$/i.test(value)
            || /(?:^|\/)(?:next-app|public-ui|web|server|android-app|packaging)(?:\/|$)/i.test(value));
          if (forbidden.length) throw new Error(JSON.stringify(forbidden));
          for (const required of ['LICENSE','SECURITY.md','types/index.d.ts','src/index.js','src/help-center.js','ish/SHA256SUMS','docs/PACKAGES.md','docs/README.md','docs/TRUSTED-PUBLISHING.md','docs/HELP-CENTER.md','docs/COOKIES.md','docs/FORMAT-GUIDE.md','docs/UPSCALING.md','docs/DENO.md','docs/SUPPORT.md','docs/MIGRATION-1.7.2.md']) {
            if (!paths.includes(required)) throw new Error(`missing ${required}`);
          }
          NODE
          rm package-preview.json
          TARBALL=$(npm pack --ignore-scripts --silent)
          PREFIX="$RUNNER_TEMP/ytconv-npm-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          npm install --prefix "$PREFIX" "$PWD/$TARBALL" --ignore-scripts
          test "$(node "$PREFIX/node_modules/ytconv/bin/ytconv.js" --version)" = "1.7.2"
          node "$PREFIX/node_modules/ytconv/bin/ytconv.js" docs migration | grep -F 'MIGRATION-1.7.2.md'

  alpine-ish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: alpine:edge
    steps:
      - run: apk add --no-cache nodejs npm python3 py3-pip ffmpeg bash curl ca-certificates git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Python engines and test both frontends
        working-directory: cli
        run: |
          python3 -m pip install --break-system-packages --no-cache-dir 'yt-dlp[default]' gallery-dl
          npm ci --ignore-scripts
          npm run docs:check
          npm run check
          npm run typecheck
          npm test
          npm run test:help-center
          npm run check:ish
          PYTHONWARNINGS=error::ResourceWarning npm run test:ish
          test "$(python3 ./ish/ytconv.py --version)" = "1.7.2"
          test "$(node ./bin/ytconv.js --version)" = "1.7.2"
          node ./bin/ytconv.js docs migration | grep -F 'MIGRATION-1.7.2.md'
          grep -F 'release/ytconv-1.7.2' ish/ytconv.py scripts/install-ish.sh

  public-youtube-mp4:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - run: python3 -m pip install --user --break-system-packages --upgrade 'yt-dlp[default]'
      - run: npm ci --ignore-scripts
      - name: Convert every supported audio and video choice twice
        run: npm run test:formats
      - name: Resolve the requested public YouTube URL twice without downloading media
        env:
          REQUESTED_URL: https://youtu.be/1VqxWNwgf5Q?si=WDyJhXeYxXwOeK1Q
        run: |
          set +e
          for pass in 1 2; do
            python3 -m yt_dlp --simulate --no-playlist --no-warnings --print '%(id)s | %(title)s' "$REQUESTED_URL"
            STATUS=$?
            if [ "$STATUS" -ne 0 ]; then
              echo "::warning::Requested URL metadata pass $pass was rejected by YouTube on the hosted runner."
            fi
          done
          exit 0
      - name: Download and verify public YouTube MP4 without cookies
        env:
          NO_COLOR: "1"
          YTCONV_NO_UPDATE_CHECK: "1"
          YTCONV_COOKIES: ""
          YTCONV_BROWSER_COOKIE_SPEC: ""
        run: |
          set +e
          node ./scripts/test-youtube-output.js 2>&1 | tee "$RUNNER_TEMP/ytconv-youtube-public.log"
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -eq 0 ]; then exit 0; fi
          if grep -Eqi 'sign in to confirm.*not a bot|public no-cookie client recovery failed|site requires a signed-in account' "$RUNNER_TEMP/ytconv-youtube-public.log"; then
            echo '::warning::YouTube rejected the GitHub-hosted runner IP after bounded no-cookie recovery. Deterministic selector, FFmpeg, file, and security tests remain blocking.'
            exit 0
          fi
          exit "$STATUS"
