name: Pin YTConv 1.6.6 publish source SHA

on:
  push:
    branches:
      - codex/perbaiki-semua-fungsi-tombol
    paths:
      - .github/release-triggers/ytconv-1.6.6-pin-publish

permissions:
  contents: write

concurrency:
  group: pin-ytconv-1.6.6-publish
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/ytconv-1.6.6-zero-deps-final
          fetch-depth: 0
      - name: Pin checkout to the immutable workflow event SHA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          target = Path('.github/workflows/publish-ytconv-stable.yml')
          text = target.read_text(encoding='utf-8')
          old = '          ref: release/ytconv-1.6.6-socket-hardening\n'
          new = '          ref: ${{ github.sha }}\n'
          if new not in text:
              if old not in text:
                  raise SystemExit('expected publish checkout ref was not found')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit pin
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/publish-ytconv-stable.yml
          if git diff --cached --quiet; then
            echo 'Publish workflow is already pinned.'
            exit 0
          fi
          git commit -m 'ci(release): pin YTConv 1.6.6 publication to event SHA'
          git push origin HEAD:release/ytconv-1.6.6-zero-deps-final
