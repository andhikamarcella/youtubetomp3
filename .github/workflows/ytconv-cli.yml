name: YTConv CLI

on:
  push:
    paths:
      - "cli/**"
      - ".github/workflows/ytconv-cli.yml"
  pull_request:
    paths:
      - "cli/**"
      - ".github/workflows/ytconv-cli.yml"

jobs:
  check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cli

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install bundled CLI dependencies
        run: npm install

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run CLI unit tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

      - name: Upload CLI test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ytconv-test-output
          path: cli/test-output.txt

      - name: Verify included tools
        run: |
          test -x vendor/yt-dlp
          test -x node_modules/ffmpeg-static/ffmpeg
          ./vendor/yt-dlp --version
          node -e "import('ffmpeg-static').then(({default:p}) => console.log(p))"

      - name: Preview npm package
        run: npm pack --dry-run
