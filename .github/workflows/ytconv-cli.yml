name: YTConv CLI 1.6.3 Stable

on:
  push:
    branches:
      - release/ytconv-1.6.3-cli-only-final
    paths:
      - "cli/**"
      - ".github/workflows/ytconv-cli.yml"
  pull_request:
    paths:
      - "cli/**"
      - ".github/workflows/ytconv-cli.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ytconv-cli-1.6.3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22.14.0, 24, 26]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run security
      - name: Verify retry hotfix and stable identity
        run: |
          test "$(node ./bin/ytconv.js --version)" = "1.6.3"
          node - <<'NODE'
          import { applyStableDefaults } from './src/defaults.js';
          import { buildDownloadArgs } from './src/downloader.js';
          const options = {
            retrySleep: 'fragment:http:linear=1::2',
            subtitles: false,
            sponsorBlockMode: 'off',
            archivePath: '',
            galleryArchivePath: '',
            initialMode: 'video',
            videoFormat: 'mp4',
            resolution: '720',
            preset: 'balanced',
          };
          applyStableDefaults(options, { disabled: { archive: true }, explicit: {} }, { homeDirectory: '/tmp/ytconv', mkdirSync() {} });
          if (options.retrySleep !== 'linear=1::2') throw new Error(options.retrySleep);
          const args = buildDownloadArgs({
            ...options,
            url: 'https://www.youtube.com/watch?v=test',
            mode: 'video',
            audioFormat: 'mp3',
            audioQuality: 'best',
            cookieConfig: { kind: 'none' },
            playlist: false,
            outputDirectory: process.cwd(),
            subtitleOnly: false,
          });
          const sleeps = args.flatMap((value, index) => args[index - 1] === '--retry-sleep' ? [value] : []);
          const expected = ['linear=1::2', 'fragment:linear=1::2', 'file_access:linear=1::2'];
          if (JSON.stringify(sleeps) !== JSON.stringify(expected)) throw new Error(JSON.stringify(sleeps));
          NODE

  desktop:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run check:ish
        if: runner.os != 'Windows'
      - run: npm run test:ish
        if: runner.os != 'Windows'
      - name: Preview CLI-only tarball
        shell: bash
        run: |
          npm pack --json --dry-run --ignore-scripts > package-preview.json
          node -e "const p=require('./package-preview.json')[0];const bad=p.files.filter(f=>/\.(?:html|css|jsx|tsx)$/i.test(f.path)||/(?:^|\/)(?:next-app|public-ui|web|server)(?:\/|$)/i.test(f.path));if(bad.length){console.error(bad);process.exit(1)}"
          rm -f package-preview.json
