name: Sync YTConv 1.6.2 generated files

on:
  push:
    branches:
      - agent/ytconv-1.6.2-youtube-output-fix
    paths:
      - .github/workflows/sync-ytconv-1.6.2-lock.yml
      - cli/package.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-ytconv-1.6.2-generated-files
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ytconv-1.6.2-youtube-output-fix
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Generate lockfile with npm
        working-directory: cli
        run: npm install --package-lock-only --ignore-scripts
      - name: Synchronize current version references in documentation
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const directory = path.join(process.cwd(), 'cli', 'docs');
          for (const name of fs.readdirSync(directory)) {
            if (!name.endsWith('.md')) continue;
            const target = path.join(directory, name);
            const original = fs.readFileSync(target, 'utf8');
            const updated = original
              .replaceAll('release/ytconv-1.6.1-cli-only-final', 'release/ytconv-1.6.2-cli-only-final')
              .replaceAll('ytconv-v1.6.1', 'ytconv-v1.6.2')
              .replaceAll('ytconv-1.6.1.tgz', 'ytconv-1.6.2.tgz')
              .replaceAll('YTConv 1.6.1', 'YTConv 1.6.2')
              .replaceAll('version `1.6.1`', 'version `1.6.2`')
              .replaceAll('Expected version: `1.6.1`', 'Expected version: `1.6.2`')
              .replaceAll('expected version `1.6.1`', 'expected version `1.6.2`');
            if (updated !== original) fs.writeFileSync(target, updated);
          }
          NODE
      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet -- cli/package-lock.json cli/docs; then
            echo "Generated files are already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cli/package-lock.json cli/docs
          git commit -m "release(cli): sync 1.6.2 generated files"
          git push origin HEAD:agent/ytconv-1.6.2-youtube-output-fix
