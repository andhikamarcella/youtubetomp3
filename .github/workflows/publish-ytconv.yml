name: Publish YTConv

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Confirm irreversible publication of ytconv@1.7.1
        required: true
        default: false
        type: boolean
  push:
    branches:
      - release/ytconv-1.7.1
    paths:
      - .github/release-markers/publish-ytconv-1.7.1

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-ytconv-1.7.1
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref_name == 'release/ytconv-1.7.1' && (github.event_name == 'push' || inputs.confirm == true) }}
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Use the pinned npm CLI
        run: npm install --global npm@11.18.0

      - name: Validate exact release source
        working-directory: cli
        run: |
          npm ci --ignore-scripts
          npm run prepack
          test "$(node -p "require('./package.json').name")" = "ytconv"
          test "$(node -p "require('./package.json').version")" = "1.7.1"
          test "$(node ./bin/ytconv.js --version)" = "1.7.1"
          test "$(cat ish/VERSION)" = "1.7.1"
          node ./bin/ytconv.js docs --list | grep -F "Documentation Topics"
          node ./bin/ytconv.js docs migration | grep -F "MIGRATION-1.7.1.md"
          node ./bin/ytconv.js about | grep -F "YTConv 1.7.1"
          node ./bin/ytconv.js shortcuts | grep -F "Ctrl+M"

      - name: Pack exact npm candidate
        id: pack
        working-directory: cli
        run: |
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/ytconv-pack.json"
          TARBALL=$(node -e "const p=require(process.env.RUNNER_TEMP + '/ytconv-pack.json')[0];process.stdout.write(require('path').join(process.env.RUNNER_TEMP,p.filename))")
          test -s "$TARBALL"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$TARBALL" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Publish through npm Trusted Publishing
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          if npm view ytconv@1.7.1 version --prefer-online >/dev/null 2>&1; then
            echo "ytconv@1.7.1 already exists; publish skipped."
          else
            npm publish "$TARBALL" --access public --tag latest --provenance
          fi

      - name: Verify npm registry publication
        env:
          EXPECTED_SHA: ${{ steps.pack.outputs.sha256 }}
        run: |
          PUBLISHED=""
          for attempt in $(seq 1 30); do
            PUBLISHED=$(npm view ytconv@1.7.1 version --prefer-online 2>/dev/null || true)
            [ "$PUBLISHED" = "1.7.1" ] && break
            sleep 4
          done
          test "$PUBLISHED" = "1.7.1"
          test "$(npm view ytconv@latest version --prefer-online)" = "1.7.1"
          URL=$(npm view ytconv@1.7.1 dist.tarball --prefer-online)
          curl --fail --silent --show-error --location "$URL" --output "$RUNNER_TEMP/registry.tgz"
          test "$(sha256sum "$RUNNER_TEMP/registry.tgz" | cut -d ' ' -f 1)" = "$EXPECTED_SHA"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          TAG="ytconv-v1.7.1"
          printf '%s  %s\n' "${{ steps.pack.outputs.sha256 }}" "$(basename "$TARBALL")" > SHA256SUMS.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$TARBALL" SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" "$TARBALL" SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "YTConv 1.7.1" \
              --generate-notes
          fi

      - name: Record successful publication
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_SHA256: ${{ steps.pack.outputs.sha256 }}
        run: |
          STATUS_PATH=".github/release-status/ytconv-1.7.1.json"
          STATUS_FILE="$RUNNER_TEMP/ytconv-1.7.1-status.json"
          jq -n \
            --arg status "published" \
            --arg package "ytconv" \
            --arg version "1.7.1" \
            --arg distTag "latest" \
            --arg sha256 "$PACKAGE_SHA256" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg sourceCommit "$GITHUB_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{status:$status,package:$package,version:$version,distTag:$distTag,sha256:$sha256,repository:$repository,branch:$branch,sourceCommit:$sourceCommit,runId:$runId,runUrl:$runUrl,publishedAt:$publishedAt}' \
            > "$STATUS_FILE"
          ENCODED=$(base64 -w0 "$STATUS_FILE")
          CURRENT_SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/$STATUS_PATH?ref=release/ytconv-1.7.1" --jq .sha 2>/dev/null || true)
          if [ -n "$CURRENT_SHA" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$STATUS_PATH" \
              -f message="release: record successful ytconv 1.7.1 publication" \
              -f content="$ENCODED" \
              -f branch="release/ytconv-1.7.1" \
              -f sha="$CURRENT_SHA"
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$STATUS_PATH" \
              -f message="release: record successful ytconv 1.7.1 publication" \
              -f content="$ENCODED" \
              -f branch="release/ytconv-1.7.1"
          fi

      - name: Record failed publication
        if: ${{ failure() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS_PATH=".github/release-status/ytconv-1.7.1.json"
          STATUS_FILE="$RUNNER_TEMP/ytconv-1.7.1-status.json"
          jq -n \
            --arg status "failed" \
            --arg package "ytconv" \
            --arg version "1.7.1" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg sourceCommit "$GITHUB_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg failedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{status:$status,package:$package,version:$version,repository:$repository,branch:$branch,sourceCommit:$sourceCommit,runId:$runId,runUrl:$runUrl,failedAt:$failedAt}' \
            > "$STATUS_FILE"
          ENCODED=$(base64 -w0 "$STATUS_FILE")
          CURRENT_SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/$STATUS_PATH?ref=release/ytconv-1.7.1" --jq .sha 2>/dev/null || true)
          if [ -n "$CURRENT_SHA" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$STATUS_PATH" \
              -f message="release: record failed ytconv 1.7.1 publication" \
              -f content="$ENCODED" \
              -f branch="release/ytconv-1.7.1" \
              -f sha="$CURRENT_SHA"
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$STATUS_PATH" \
              -f message="release: record failed ytconv 1.7.1 publication" \
              -f content="$ENCODED" \
              -f branch="release/ytconv-1.7.1"
          fi
