name: Publish YTConv Beta to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Beta version; must match cli/package.json"
        required: true
        default: "1.5.0-beta.2"
      confirm:
        description: "Type PUBLISH-BETA to continue"
        required: true

permissions:
  contents: read
  id-token: write

environment: npm

jobs:
  publish:
    if: ${{ inputs.confirm == 'PUBLISH-BETA' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Capture stable tag
        run: echo "LATEST_BEFORE=$(npm view ytconv@latest version --prefer-online)" >> "$GITHUB_ENV"
      - name: Verify beta package identity
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_TAG=$(node -p "require('./package.json').publishConfig.tag")
          test "$PACKAGE_VERSION" = "${{ inputs.version }}"
          test "$PACKAGE_VERSION" = "1.5.0-beta.2"
          test "$PACKAGE_TAG" = "beta"
          case "$PACKAGE_VERSION" in
            *-beta.*) ;;
            *) echo "The package is not a beta prerelease."; exit 1 ;;
          esac
          if npm view "ytconv@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "ytconv@$PACKAGE_VERSION is already published; refusing to overwrite it."
            exit 1
          fi
      - name: Install and test clean beta package
        run: |
          npm install
          npm run check
          npm test
          npm run check:ish
          npm run test:ish
          npm publish --dry-run --tag beta
      - name: Publish beta package with provenance
        run: npm publish --tag beta --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify beta registry tag and preserve latest
        run: |
          test "$(npm view ytconv@beta version --prefer-online)" = "${{ inputs.version }}"
          test "$(npm view ytconv@latest version --prefer-online)" = "$LATEST_BEFORE"
          npm view "ytconv@${{ inputs.version }}" dist.integrity
          npm view ytconv dist-tags --json
