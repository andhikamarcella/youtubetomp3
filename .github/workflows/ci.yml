name: CI

on:
  pull_request:
  push:
    branches: [ main, master, work ]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      OUTPUT_DIR: /tmp/ytconv/outputs
      TEMP_DIR: /tmp/ytconv/jobs
      CACHE_DIR: /tmp/ytconv/cache
      COOKIES_PATH: /tmp/ytconv/cookies.txt
      COOKIE_STORE_PATH: /tmp/ytconv/cookie-store.json
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile Python downloader
        run: python3 -m py_compile download_audio.py
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        id: unit_tests
        shell: bash
        run: |
          set +e
          npm test > unit-test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::group::Unit test failure details"
            tail -n 240 unit-test.log
            echo "::endgroup::"
            exit "$status"
          fi
          tail -n 40 unit-test.log
      - name: Upload unit test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-log-node-${{ matrix.node-version }}
          path: unit-test.log
          if-no-files-found: error
          retention-days: 3
      - name: Security regression tests
        run: npm run test:security
      - name: E2E route smoke tests
        run: npm run test:e2e
      - name: Accessibility static checks
        run: npm run test:accessibility
      - name: Production build check
        run: npm run build
      - name: Build Render Docker image
        if: matrix.node-version == '22.x'
        run: docker build --pull -t ytconv-render-ci .
      - name: Dependency audit
        run: npm run audit
      - name: Secret scan
        run: npm run secret-scan
