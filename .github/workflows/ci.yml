name: CI

on:
  pull_request:
  push:
    branches: [ main, master, work ]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      OUTPUT_DIR: /tmp/ytconv/outputs
      TEMP_DIR: /tmp/ytconv/jobs
      CACHE_DIR: /tmp/ytconv/cache
      COOKIES_PATH: /tmp/ytconv/cookies.txt
      COOKIE_STORE_PATH: /tmp/ytconv/cookie-store.json
      YTDLP_SMOKE_PROXY: ${{ secrets.YTDLP_SMOKE_PROXY }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile Python downloader
        run: python3 -m py_compile download_audio.py
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        id: unit_tests
        shell: bash
        run: |
          set +e
          npm test > unit-test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::group::Unit test failure details"
            tail -n 240 unit-test.log
            echo "::endgroup::"
            exit "$status"
          fi
          tail -n 40 unit-test.log
      - name: Upload unit test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-log-node-${{ matrix.node-version }}
          path: unit-test.log
          if-no-files-found: error
          retention-days: 3
      - name: Security regression tests
        run: npm run test:security
      - name: E2E route smoke tests
        run: npm run test:e2e
      - name: Accessibility static checks
        run: npm run test:accessibility
      - name: Production build check
        run: npm run build
      - name: Build Render Docker image
        if: matrix.node-version == '22.x'
        run: docker build --pull -t ytconv-render-ci .
      - name: Cookie-free YouTube client rotation diagnostic
        id: youtube_guest_diagnostic
        if: matrix.node-version == '22.x'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --entrypoint sh ytconv-render-ci -c '
            set -u
            node /opt/bgutil-provider/build/main.js --port 4416 >/tmp/pot-provider.log 2>&1 &
            provider_pid=$!
            trap "kill $provider_pid 2>/dev/null || true" EXIT
            sleep 4
            for client in mweb web_embedded android_vr web_safari default; do
              rm -f /tmp/ytconv-guest-smoke.*
              echo "=== cookie-free client: $client ==="
              extractor="youtube:player_client=$client"
              if [ "$client" = "mweb" ]; then
                extractor="$extractor;fetch_pot=always"
              fi
              if yt-dlp \
                --verbose \
                --no-playlist \
                --no-part \
                --js-runtimes deno \
                --remote-components ejs:npm \
                --extractor-args "$extractor" \
                --extractor-args "youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416" \
                --impersonate chrome \
                --sleep-requests 0.75 \
                -f "worstaudio/best" \
                -o "/tmp/ytconv-guest-smoke.%(ext)s" \
                "https://www.youtube.com/watch?v=jNQXAC9IVRw"; then
                test -n "$(find /tmp -maxdepth 1 -type f -name "ytconv-guest-smoke.*" -print -quit)"
                echo "COOKIE_FREE_CLIENT_SUCCESS=$client"
                exit 0
              fi
              sleep 3
            done
            echo "=== PO-token provider log ==="
            cat /tmp/pot-provider.log || true
            exit 1
          ' 2>&1 | tee youtube-guest-diagnostic.log
      - name: Record cookie-free client result
        if: matrix.node-version == '22.x' && always()
        shell: bash
        run: |
          result="$(grep -o 'COOKIE_FREE_CLIENT_SUCCESS=[A-Za-z0-9_-]*' youtube-guest-diagnostic.log 2>/dev/null | tail -n 1 || true)"
          if [ -z "$result" ]; then
            result="COOKIE_FREE_CLIENT_SUCCESS=none"
          fi
          printf '%s\n' "$result" | tee youtube-client-result.txt
      - name: Upload cookie-free client result
        if: matrix.node-version == '22.x' && always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-client-result
          path: youtube-client-result.txt
          if-no-files-found: error
          retention-days: 3
      - name: Upload cookie-free client diagnostic
        if: matrix.node-version == '22.x' && steps.youtube_guest_diagnostic.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: youtube-guest-diagnostic-log
          path: youtube-guest-diagnostic.log
          if-no-files-found: error
          retention-days: 3
      - name: Explain live YouTube smoke requirement
        if: matrix.node-version == '22.x' && env.YTDLP_SMOKE_PROXY == ''
        run: echo "Proxy-backed smoke skipped. The cookie-free client diagnostic above still tests direct datacenter egress. Configure YTDLP_SMOKE_PROXY with private residential/static egress for the production-equivalent check."
      - name: Cookie-free YouTube Docker smoke test
        id: youtube_smoke
        if: matrix.node-version == '22.x' && env.YTDLP_SMOKE_PROXY != ''
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          docker run --rm \
            -e YTDLP_PROXY="$YTDLP_SMOKE_PROXY" \
            --entrypoint sh ytconv-render-ci -c '
              set -eu
              node /opt/bgutil-provider/build/main.js --port 4416 >/tmp/pot-provider.log 2>&1 &
              provider_pid=$!
              trap "kill $provider_pid 2>/dev/null || true" EXIT
              sleep 4
              attempt=1
              while [ "$attempt" -le 3 ]; do
                rm -f /tmp/ytconv-smoke.*
                echo "=== yt-dlp attempt $attempt ==="
                if yt-dlp \
                  --verbose \
                  --no-playlist \
                  --no-part \
                  --proxy "$YTDLP_PROXY" \
                  --js-runtimes deno \
                  --remote-components ejs:npm \
                  --extractor-args "youtube:player_client=mweb;fetch_pot=always" \
                  --extractor-args "youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416" \
                  --impersonate chrome \
                  --sleep-requests 0.75 \
                  -f "worstaudio/best" \
                  -o "/tmp/ytconv-smoke.%(ext)s" \
                  "https://www.youtube.com/watch?v=jNQXAC9IVRw"; then
                  test -n "$(find /tmp -maxdepth 1 -type f -name "ytconv-smoke.*" -print -quit)"
                  echo "Cookie-free YouTube download succeeded"
                  exit 0
                fi
                attempt=$((attempt + 1))
                sleep $((attempt * 3))
              done
              echo "=== PO-token provider log ==="
              cat /tmp/pot-provider.log || true
              exit 1
            ' 2>&1 | tee youtube-smoke.log
      - name: Upload YouTube smoke log
        if: matrix.node-version == '22.x' && env.YTDLP_SMOKE_PROXY != '' && steps.youtube_smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: youtube-smoke-log
          path: youtube-smoke.log
          if-no-files-found: error
          retention-days: 3
      - name: Enforce YouTube smoke result
        if: matrix.node-version == '22.x' && env.YTDLP_SMOKE_PROXY != '' && steps.youtube_smoke.outcome == 'failure'
        run: exit 1
      - name: Dependency audit
        run: npm run audit
      - name: Secret scan
        run: npm run secret-scan
