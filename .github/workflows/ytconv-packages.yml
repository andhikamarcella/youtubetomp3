name: YTConv 1.6.5 Native Package Matrix

on:
  push:
    branches:
      - release/ytconv-1.6.5-packages
    paths:
      - "cli/**"
      - "packaging/**"
      - "android-app/**"
      - "flake.nix"
      - ".github/workflows/ytconv-packages.yml"
  pull_request:
    paths:
      - "cli/**"
      - "packaging/**"
      - "android-app/**"
      - "flake.nix"
      - ".github/workflows/ytconv-packages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ytconv-packages-1.6.5-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: 1.6.5

jobs:
  linux-native-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: '1.26.x'
          cache: false
      - name: Install exact packaging tools
        run: |
          sudo apt-get update || { sleep 10; sudo apt-get update; }
          sudo apt-get install -y curl xz-utils zstd rpm squashfs-tools snapd python3 python3-pip unzip
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build DEB RPM Arch portable AppImage Snap and Termux packages
        run: |
          chmod +x packaging/*.sh
          packaging/build-native-packages.sh
          packaging/build-portable-archives.sh
          packaging/build-appimage.sh
          packaging/build-snap.sh
          packaging/build-termux-deb.sh
      - name: Install DEB package in Debian
        run: |
          docker run --rm -v "$PWD/dist/packages:/packages:ro" debian:bookworm-slim sh -exc '
            apt-get update
            apt-get install -y /packages/ytconv_1.6.5_amd64.deb
            test "$(ytconv --version)" = 1.6.5
          '
      - name: Install RPM package in Fedora
        run: |
          docker run --rm -v "$PWD/dist/packages:/packages:ro" fedora:latest sh -exc '
            dnf install -y /packages/ytconv-1.6.5-1.x86_64.rpm
            test "$(ytconv --version)" = 1.6.5
          '
      - name: Install RPM package in openSUSE
        run: |
          docker run --rm -v "$PWD/dist/packages:/packages:ro" opensuse/tumbleweed sh -exc '
            zypper --non-interactive install /packages/ytconv-1.6.5-1.x86_64.rpm
            test "$(ytconv --version)" = 1.6.5
          '
      - name: Install Arch package
        run: |
          docker run --rm -v "$PWD/dist/packages:/packages:ro" archlinux:base sh -exc '
            pacman -Sy --noconfirm ca-certificates
            pacman -U --noconfirm /packages/ytconv-1.6.5-1-x86_64.pkg.tar.zst
            test "$(ytconv --version)" = 1.6.5
          '
      - name: Verify release artifacts are non-empty
        run: |
          find dist -type f -size +0 -print
          test -f dist/packages/ytconv_1.6.5_amd64.deb
          test -f dist/packages/ytconv-1.6.5-1.x86_64.rpm
          test -f dist/packages/ytconv-1.6.5-1-x86_64.pkg.tar.zst
          test -f dist/appimage/YTConv-1.6.5-x86_64.AppImage
          test -f dist/snap/ytconv_1.6.5_amd64.snap
          test -f dist/termux/ytconv_1.6.5_all-termux.deb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ytconv-1.6.5-linux-x86_64
          path: |
            dist/packages/*
            dist/portable/*
            dist/appimage/*
            dist/snap/*
            dist/termux/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  linux-native-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: '1.26.x'
          cache: false
      - run: |
          sudo apt-get update || { sleep 10; sudo apt-get update; }
          sudo apt-get install -y curl xz-utils zstd rpm python3 unzip
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build ARM64 DEB RPM Arch and portable archives
        run: |
          chmod +x packaging/*.sh
          packaging/build-native-packages.sh
          packaging/build-portable-archives.sh
          test -f dist/packages/ytconv_1.6.5_arm64.deb
          test -f dist/packages/ytconv-1.6.5-1.aarch64.rpm
          test -f dist/packages/ytconv-1.6.5-1-aarch64.pkg.tar.zst
          test -f dist/portable/YTConv-1.6.5-linux-aarch64.tar.gz
      - name: Install ARM64 DEB locally
        run: |
          sudo apt-get install -y ./dist/packages/ytconv_1.6.5_arm64.deb
          test "$(ytconv --version)" = "1.6.5"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ytconv-1.6.5-linux-arm64
          path: |
            dist/packages/*
            dist/portable/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  alpine-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build Alpine APK in Alpine edge
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace alpine:edge sh -exc '
            apk add --no-cache alpine-sdk abuild sudo python3 py3-pip nodejs npm curl ca-certificates
            sh packaging/build-alpine-apk.sh /workspace/dist/alpine
          '
      - name: Install and run Alpine APK
        run: |
          docker run --rm -v "$PWD/dist/alpine:/packages:ro" alpine:edge sh -exc '
            apk add --no-cache python3 py3-pip ffmpeg ca-certificates yt-dlp gallery-dl
            sha256sum -c /packages/SHA256SUMS-alpine.txt
            apk add --allow-untrusted /packages/ytconv-1.6.5-r0.apk
            test "$(ytconv --version)" = 1.6.5
            ytconv --diagnose
          '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ytconv-1.6.5-alpine-apk
          path: dist/alpine/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  flatpak:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - run: |
          sudo apt-get update || { sleep 10; sudo apt-get update; }
          sudo apt-get install -y flatpak flatpak-builder curl xz-utils
          chmod +x packaging/*.sh
          packaging/build-flatpak.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ytconv-1.6.5-flatpak
          path: dist/flatpak/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: '1.26.x'
          cache: false
      - name: Build install and verify EXE and portable ZIP
        shell: pwsh
        run: |
          .\packaging\build-windows-exe.ps1
          if (-not (Test-Path .\dist\windows\YTConv-1.6.5-Setup-x64.exe)) { throw 'EXE installer is missing' }
          if (-not (Test-Path .\dist\windows\YTConv-1.6.5-portable-win-x64.zip)) { throw 'portable ZIP is missing' }
          $installed = & "$env:LOCALAPPDATA\Programs\YTConv\ytconv.cmd" --version
          if ($installed.Trim() -ne '1.6.5') { throw "wrong installed version: $installed" }
          $launcher = & "$env:LOCALAPPDATA\Microsoft\WindowsApps\ytconv.cmd" --version
          if ($launcher.Trim() -ne '1.6.5') { throw "wrong launcher version: $launcher" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ytconv-1.6.5-windows
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android-app/**/*.gradle
      - name: Build lint and inspect Android APKs
        run: |
          chmod +x packaging/build-android-apk.sh
          packaging/build-android-apk.sh
          test -f dist/android/YTConv-1.6.5-debug.apk
          test -f dist/android/YTConv-1.6.5-release-unsigned.apk
          test -f dist/android/YTConv-Android-1.6.5-source.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ytconv-1.6.5-android
          path: dist/android/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: DeterminateSystems/nix-installer-action@ab6bcb2d5af0e904d04aea750e2089e9dc4cbfdd
        with:
          determinate: false
      - name: Build and run the Nix package
        run: |
          nix flake lock
          nix build --print-build-logs
          test "$(./result/bin/ytconv --version)" = "1.6.5"
          cp flake.lock dist-flake.lock
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ytconv-1.6.5-nix-lock
          path: dist-flake.lock
          if-no-files-found: error
          retention-days: 14
