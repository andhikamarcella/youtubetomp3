name: Publish ShipForge 0.1.0 to npm

on:
  push:
    branches:
      - codex/perbaiki-semua-fungsi-tombol
    paths:
      - ".github/release-markers/publish-shipforge-0.1.0"

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: publish-shipforge-0.1.0
  cancel-in-progress: false

jobs:
  publish:
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PACKAGE_NAME: shipforge-cli
      VERSION: 0.1.0
      SOURCE_SHA: addbe0be4cc6fc90c54f396f3ad3aeadb176f7ef
    steps:
      - name: Checkout immutable ShipForge source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify package identity
        working-directory: shipforge
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(node -p "require('./package.json').name")" = "$PACKAGE_NAME"
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          test "$(node -p "require('./package.json').license")" = "MIT"
          test "$(node -p "require('./package.json').repository.directory")" = "shipforge"
          node --input-type=module - <<'NODE'
          const manifest = JSON.parse(await (await import('node:fs/promises')).readFile('package.json', 'utf8'));
          for (const field of ['dependencies', 'optionalDependencies', 'peerDependencies']) {
            if (Object.keys(manifest[field] || {}).length) {
              throw new Error(`${field} must remain empty`);
            }
          }
          for (const hook of ['preinstall', 'install', 'postinstall']) {
            if (manifest.scripts?.[hook]) throw new Error(`forbidden lifecycle hook: ${hook}`);
          }
          NODE

      - name: Install exact development graph
        working-directory: shipforge
        run: npm ci --ignore-scripts

      - name: Run release validation
        working-directory: shipforge
        run: |
          npm run check
          npm test

      - name: Build immutable npm tarball
        id: package
        working-directory: shipforge
        run: |
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/shipforge-pack.json"
          TARBALL=$(node -e "const p=require(process.env.RUNNER_TEMP + '/shipforge-pack.json')[0];process.stdout.write(require('path').join(process.env.RUNNER_TEMP,p.filename))")
          test -s "$TARBALL"
          SHA256=$(sha256sum "$TARBALL" | cut -d ' ' -f 1)
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Publish npm package with provenance
        working-directory: shipforge
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_SHA: ${{ env.SOURCE_SHA }}
        run: |
          if npm view "$PACKAGE_NAME@$VERSION" version --prefer-online >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$VERSION already exists; immutable publish skipped."
          else
            test -n "${NODE_AUTH_TOKEN:-}"
            npm publish "${{ steps.package.outputs.tarball }}" --access public --tag latest --provenance
          fi

      - name: Verify npm latest and registry tarball
        working-directory: shipforge
        run: |
          READY=false
          for ATTEMPT in $(seq 1 30); do
            REGISTRY_VERSION=$(npm view "$PACKAGE_NAME@latest" version --prefer-online 2>/dev/null || true)
            if [ "$REGISTRY_VERSION" = "$VERSION" ]; then
              READY=true
              break
            fi
            echo "Waiting for npm propagation ($ATTEMPT/30)..."
            sleep 5
          done
          test "$READY" = true
          URL=$(npm view "$PACKAGE_NAME@$VERSION" dist.tarball --prefer-online)
          curl --fail --location --retry 5 "$URL" -o "$RUNNER_TEMP/shipforge-registry.tgz"
          test "$(sha256sum "$RUNNER_TEMP/shipforge-registry.tgz" | cut -d ' ' -f 1)" = "${{ steps.package.outputs.sha256 }}"

      - name: Report success
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 199 --repo "$GITHUB_REPOSITORY" --body "✅ **shipforge-cli@0.1.0** published to npm with provenance. The **latest** dist-tag and registry tarball bytes were verified. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Report failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 199 --repo "$GITHUB_REPOSITORY" --body "❌ ShipForge 0.1.0 npm publication failed. Do not claim success until the npm version, latest dist-tag, and registry tarball verification pass. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
