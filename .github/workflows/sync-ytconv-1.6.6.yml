name: Sync YTConv 1.6.6 release metadata

on:
  push:
    branches: [codex/perbaiki-semua-fungsi-tombol]
    paths:
      - ".github/workflows/sync-ytconv-1.6.6.yml"
      - ".github/ytconv-1.6.6-sync-trigger"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/ytconv-1.6.6-socket-hardening
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - name: Synchronize active 1.6.6 files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          old_version = '1.6.5'
          new_version = '1.6.6'
          old_branch = 'release/ytconv-1.6.5-packages'
          new_branch = 'release/ytconv-1.6.6-socket-hardening'
          allowed_suffixes = {
              '.md', '.txt', '.json', '.js', '.mjs', '.py', '.sh', '.cmd', '.ps1',
              '.yml', '.yaml', '.xml', '.gradle', '.kts', '.nix', '.toml', '.spec',
              '.ebuild', '.template', '.desktop', '.metainfo', '.conf', '.go',
          }
          explicit = [root / 'flake.nix']
          roots = [
              root / 'cli' / 'README.md',
              root / 'cli' / 'docs',
              root / 'cli' / 'scripts',
              root / 'cli' / 'ish',
              root / 'packaging',
              root / 'android-app',
          ]
          files = []
          for item in roots + explicit:
              if item.is_file():
                  files.append(item)
              elif item.is_dir():
                  files.extend(path for path in item.rglob('*') if path.is_file())

          for path in files:
              if path.name in {'SHA256SUMS', 'CHANGELOG.md'}:
                  continue
              if path.suffix.lower() not in allowed_suffixes and path.name not in {'VERSION', 'APKBUILD', 'PKGBUILD'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text.replace(old_branch, new_branch).replace(old_version, new_version)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          readme_path = root / 'cli' / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          socket_badge = '[![Socket Badge](https://badge.socket.dev/npm/package/ytconv/1.6.6)](https://badge.socket.dev/npm/package/ytconv/1.6.6)'
          runtime_badge = '[![Runtime dependencies](https://img.shields.io/badge/runtime_dependencies-0-brightgreen)](https://github.com/andhikamarcella/youtubetomp3/blob/release/ytconv-1.6.6-socket-hardening/cli/SECURITY.md)'
          if runtime_badge not in readme:
              readme = readme.replace(socket_badge, socket_badge + '\n' + runtime_badge)

          replacement = '''## What changed in 1.6.6

- Removed every production npm dependency. The published CLI now has `"dependencies": {}`.
- Replaced React, Ink, and Figlet with a dependency-free terminal wizard built from Node.js modules.
- Replaced the `ws` package with Node.js 22+ built-in WebSocket support for the loopback-only browser bridge.
- Replaced `which` with internal PATH/PATHEXT executable resolution and Unix execute-permission checks.
- Added package gates that reject minified JavaScript, source maps, native binary payloads, external runtime imports, debug statements, dynamic evaluation, and shell execution.
- Added repository-level Socket configuration scoped to the actual `cli/package.json` and lockfile while keeping security alerts enabled.
- Kept npm installation free of `preinstall`, `install`, and `postinstall` hooks.
- Preserved public YouTube AUTO routing: regular YouTube → MP4, YouTube Music → MP3.
- Preserved Windows EXE, Android APK, DEB, RPM, Arch, Alpine APK, AppImage, Snap, Flatpak, Nix, Termux, iSH, and portable packages.

## Socket and supply-chain status

YTConv 1.6.6 has **zero production npm dependencies**, so transitive findings such as optimized overrides, unmaintained packages, minified dependency code, and dependency debug access are removed from the npm runtime graph.

Socket can still report **network**, **filesystem**, **environment-variable**, **URL-string**, and **child-process** capabilities because a downloader must fetch the URL selected by the user, invoke yt-dlp/FFmpeg, and save media. These capabilities are constrained: no shell execution, no telemetry, secrets are removed from child environments, engine downloads are HTTPS/allowlist/SHA-256 verified, browser automation is loopback-only, and filesystem writes are limited to selected output plus YTConv-managed state. See [SECURITY.md](https://github.com/andhikamarcella/youtubetomp3/blob/release/ytconv-1.6.6-socket-hardening/cli/SECURITY.md).
'''
          readme = re.sub(
              r'## What changed in 1\.6\.6\n.*?(?=\n## Choose an installation method)',
              replacement.rstrip(),
              readme,
              flags=re.S,
          )
          readme_path.write_text(readme, encoding='utf-8')
          PY

          cd cli
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          sha256sum ish/ytconv.py ish/ytconv-core.py | sed 's#ish/##' > ish/SHA256SUMS
          npm install --ignore-scripts --no-audit --no-fund
          npm run check
          node --test ./test/socket-hardening.test.js ./test/supply-chain.test.js
      - name: Commit synchronized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cli packaging android-app flake.nix
          if git diff --cached --quiet; then
            echo "Nothing to synchronize."
            exit 0
          fi
          git commit -m "chore(release): synchronize YTConv 1.6.6 metadata and lockfile"
          git push origin HEAD:release/ytconv-1.6.6-socket-hardening
