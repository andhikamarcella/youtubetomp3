name: Prepare YTConv 1.6.7

on:
  push:
    branches:
      - codex/perbaiki-semua-fungsi-tombol
    paths:
      - ".github/release-markers/prepare-ytconv-1.6.7"

permissions:
  contents: write
  issues: write

concurrency:
  group: prepare-ytconv-1.6.7
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TARGET_BRANCH: agent/ytconv-1.6.7-identity-and-social
    steps:
      - name: Checkout 1.6.7 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/ytconv-1.6.7-identity-and-social
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false

      - name: Apply 1.6.7 migration
        run: node .github/scripts/prepare-ytconv-1.6.7.mjs

      - name: Regenerate exact npm graph without lifecycle scripts
        working-directory: cli
        run: |
          npm install -g npm@11.18.0
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts
          (cd ish && sha256sum ytconv.py ytconv-core.py > SHA256SUMS)

      - name: Validate CLI and security
        working-directory: cli
        run: |
          npm run check
          npm run typecheck
          npm test
          npm run check:ish
          PYTHONWARNINGS=error::ResourceWarning npm run test:ish
          npm run security
          npm audit --omit=dev

      - name: Build Android debug APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Commit prepared 1.6.7 source
        run: |
          rm -f .github/scripts/prepare-ytconv-1.6.7.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare YTConv 1.6.7 identity and social UX"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Report success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 184 --repo "$GITHUB_REPOSITORY" --body "YTConv 1.6.7 preparation completed on branch **$TARGET_BRANCH**. Figlet/Commander/which/isexe, animated progress, subtitles-off defaults, social browser login, and Android 1.6.7 were validated. Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true

      - name: Report failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 184 --repo "$GITHUB_REPOSITORY" --body "YTConv 1.6.7 preparation failed. Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
