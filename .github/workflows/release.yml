name: Publish ShipForge

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish
        required: true
        default: 0.1.0
        type: string
      confirm:
        description: Confirm irreversible npm publication
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: shipforge-npm-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ inputs.confirm == true }}
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install and validate
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test
          test "$(node -p "require('./package.json').name")" = "shipforge-cli"
          test "$(node -p "require('./package.json').version")" = "${{ inputs.version }}"

      - name: Pack exact candidate
        id: pack
        run: |
          npm pack --ignore-scripts --json > "$RUNNER_TEMP/pack.json"
          TARBALL=$(node -e "const p=require(process.env.RUNNER_TEMP + '/pack.json')[0];process.stdout.write(p.filename)")
          test -s "$TARBALL"
          SHA256=$(sha256sum "$TARBALL" | cut -d ' ' -f 1)
          echo "$SHA256  $TARBALL" > SHA256SUMS.txt
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Publish npm with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ inputs.version }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          test -n "${NODE_AUTH_TOKEN:-}"
          if npm view "shipforge-cli@$VERSION" version --prefer-online >/dev/null 2>&1; then
            echo "shipforge-cli@$VERSION already exists; publish skipped."
          else
            npm publish "$TARBALL" --access public --tag latest --provenance
          fi

      - name: Verify npm latest and registry bytes
        env:
          VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ steps.pack.outputs.sha256 }}
        run: |
          for attempt in $(seq 1 20); do
            PUBLISHED=$(npm view "shipforge-cli@$VERSION" version --prefer-online 2>/dev/null || true)
            [ "$PUBLISHED" = "$VERSION" ] && break
            sleep 3
          done
          test "$PUBLISHED" = "$VERSION"
          LATEST=$(npm view shipforge-cli@latest version --prefer-online)
          test "$LATEST" = "$VERSION"
          URL=$(npm view "shipforge-cli@$VERSION" dist.tarball --prefer-online)
          curl --fail --silent --show-error --location "$URL" --output "$RUNNER_TEMP/registry.tgz"
          ACTUAL_SHA=$(sha256sum "$RUNNER_TEMP/registry.tgz" | cut -d ' ' -f 1)
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$TARBALL" SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" "$TARBALL" SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "ShipForge $VERSION" \
              --generate-notes
          fi
