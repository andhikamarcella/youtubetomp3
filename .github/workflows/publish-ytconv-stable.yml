name: Publish YTConv 1.6.3 to npm

on:
  push:
    branches:
      - release/ytconv-1.6.3-cli-only-final
    paths:
      - ".github/workflows/publish-ytconv-stable.yml"
      - "cli/**"
      - "scripts/ytconv-release-metadata.mjs"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type PUBLISH-STABLE to continue"
        required: true

permissions:
  contents: write
  id-token: write
  issues: write

concurrency:
  group: ytconv-npm-1.6.3
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'push' || inputs.confirm == 'PUBLISH-STABLE' }}
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Pin npm and synchronize lock metadata
        run: |
          npm install -g npm@11.19.0
          npm install --package-lock-only --ignore-scripts
      - name: Verify release identity and retry fix
        id: identity
        run: |
          test "$(node -p "require('./package.json').version")" = "1.6.3"
          test "$(node -p "require('./package.json').publishConfig.tag")" = "latest"
          test "$(node -p "require('./package.json').license")" = "MIT"
          node - <<'NODE'
          import { applyStableDefaults } from './src/defaults.js';
          import { buildDownloadArgs } from './src/downloader.js';
          const options = {
            retrySleep: 'fragment:http:linear=1::2', subtitles: false,
            sponsorBlockMode: 'off', archivePath: '', galleryArchivePath: '',
            initialMode: 'video', videoFormat: 'mp4', resolution: '720', preset: 'balanced',
          };
          applyStableDefaults(options, { disabled: { archive: true }, explicit: {} }, { homeDirectory: '/tmp/ytconv', mkdirSync() {} });
          if (options.retrySleep !== 'linear=1::2') throw new Error(options.retrySleep);
          const args = buildDownloadArgs({
            ...options, url: 'https://www.youtube.com/watch?v=test', mode: 'video',
            audioFormat: 'mp3', audioQuality: 'best', cookieConfig: { kind: 'none' },
            playlist: false, outputDirectory: process.cwd(), subtitleOnly: false,
          });
          const sleeps = args.flatMap((value, index) => args[index - 1] === '--retry-sleep' ? [value] : []);
          const expected = ['linear=1::2', 'fragment:linear=1::2', 'file_access:linear=1::2'];
          if (JSON.stringify(sleeps) !== JSON.stringify(expected)) throw new Error(JSON.stringify(sleeps));
          NODE
          if npm view ytconv@1.6.3 version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Test and audit the CLI
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test
          npm run check:ish
          npm run test:ish
          npm run security
      - name: Build exact CLI-only tarball
        id: package
        run: |
          npm sbom --omit=dev --sbom-format cyclonedx > "$RUNNER_TEMP/ytconv-1.6.3.cdx.json"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/ytconv-pack.json"
          TARBALL=$(node -e "const p=require('$RUNNER_TEMP/ytconv-pack.json')[0];process.stdout.write(require('path').join('$RUNNER_TEMP',p.filename))")
          node -e "const p=require('$RUNNER_TEMP/ytconv-pack.json')[0];const bad=p.files.filter(f=>/\.(?:html|css|jsx|tsx)$/i.test(f.path)||/(?:^|\/)(?:next-app|public-ui|web|server)(?:\/|$)/i.test(f.path));if(bad.length){console.error(bad);process.exit(1)}"
          SHA256=$(sha256sum "$TARBALL" | cut -d ' ' -f 1)
          printf '%s  %s\n' "$SHA256" "ytconv-1.6.3.tgz" > "$RUNNER_TEMP/SHA256SUMS.txt"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
      - name: Dry-run exact tarball
        if: ${{ steps.identity.outputs.already_published != 'true' }}
        run: npm publish "${{ steps.package.outputs.tarball }}" --dry-run --tag latest
      - name: Publish stable package
        if: ${{ steps.identity.outputs.already_published != 'true' }}
        run: npm publish "${{ steps.package.outputs.tarball }}" --tag latest --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify npm latest
        run: |
          READY=false
          for ATTEMPT in $(seq 1 18); do
            VERSION=$(npm view ytconv@latest version --prefer-online 2>/dev/null || true)
            if [ "$VERSION" = "1.6.3" ]; then READY=true; break; fi
            echo "Waiting for npm propagation ($ATTEMPT/18)..."
            sleep 5
          done
          test "$READY" = "true"
          URL=$(npm view ytconv@1.6.3 dist.tarball --prefer-online)
          curl --fail --location --retry 5 "$URL" -o "$RUNNER_TEMP/ytconv-1.6.3.registry.tgz"
          test "$(sha256sum "$RUNNER_TEMP/ytconv-1.6.3.registry.tgz" | cut -d ' ' -f 1)" = "${{ steps.package.outputs.sha256 }}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ytconv-v1.6.3"
          ASSETS=(
            "${{ steps.package.outputs.tarball }}"
            "$RUNNER_TEMP/ytconv-1.6.3.cdx.json"
            "$RUNNER_TEMP/SHA256SUMS.txt"
          )
          NOTES=$(node -p "require('./package.json').releaseNotes")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" --target "$GITHUB_SHA" --title "YTConv CLI 1.6.3" --notes "$NOTES"
          fi
      - name: Report failure
        if: ${{ failure() }}
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "YTConv 1.6.3 publish failed" \
            --body "Publication failed in https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID at commit $GITHUB_SHA." || true
