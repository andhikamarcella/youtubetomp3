name: Verify YTConv 1.6.4 Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-ytconv-1.6.4
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2960e7fbad3712603d6b1b51ac273f195fd2649e
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install committed graph without lifecycle scripts
        run: |
          npm install -g npm@11.18.0
          npm ci --ignore-scripts
      - name: Re-run release validation
        run: |
          test "$(node -p "require('./package.json').version")" = "1.6.4"
          test "$(node -p "require('./package.json').license")" = "ISC"
          test "$(node -p "require('./package.json').packageManager")" = "npm@11.18.0"
          npm run check
          npm run typecheck
          npm test
          npm run check:ish
          PYTHONWARNINGS=error::ResourceWarning npm run test:ish
          npm run security
      - name: Verify npm latest, registry bytes, and GitHub tag
        run: |
          test "$(npm view ytconv@latest version --prefer-online)" = "1.6.4"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/ytconv-pack.json"
          LOCAL_TARBALL=$(node -e "const p=require('$RUNNER_TEMP/ytconv-pack.json')[0];process.stdout.write(require('path').join('$RUNNER_TEMP',p.filename))")
          LOCAL_SHA=$(sha256sum "$LOCAL_TARBALL" | cut -d ' ' -f 1)
          URL=$(npm view ytconv@1.6.4 dist.tarball --prefer-online)
          curl --fail --location --retry 5 "$URL" -o "$RUNNER_TEMP/ytconv-1.6.4.registry.tgz"
          test "$(sha256sum "$RUNNER_TEMP/ytconv-1.6.4.registry.tgz" | cut -d ' ' -f 1)" = "$LOCAL_SHA"
          git fetch --tags --force
          test "$(git rev-list -n 1 ytconv-v1.6.4)" = "2960e7fbad3712603d6b1b51ac273f195fd2649e"
