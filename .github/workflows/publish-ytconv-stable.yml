name: Publish YTConv Stable to npm

on:
  push:
    branches:
      - release/ytconv-1.5.5-cli-only-final
    paths:
      - ".github/workflows/publish-ytconv-stable.yml"
      - "cli/**"
      - "release-metadata/ytconv-1.5.5.json"
      - "scripts/ytconv-release-metadata.mjs"
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version; must match cli/package.json"
        required: true
        default: "1.5.5"
      confirm:
        description: "Type PUBLISH-STABLE to continue"
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: ${{ github.event_name == 'push' || inputs.confirm == 'PUBLISH-STABLE' }}
    environment: npm
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '1.5.5' }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Verify stable package identity
        run: |
          test ! -f ../.github/workflows/ytconv-auth.yml
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_TAG=$(node -p "require('./package.json').publishConfig.tag")
          test "$PACKAGE_VERSION" = "$RELEASE_VERSION"
          test "$PACKAGE_VERSION" = "1.5.5"
          test "$PACKAGE_TAG" = "latest"
          test "$(node -p "require('./package.json').publisher")" = "Andhika Marcella Fernanda"
          test "$(node -p "require('./package.json').license")" = "MIT"
          test "$(node -p "require('./package.json').releaseDate")" = "2026-08-02"
          node -e "const p=require('./package.json'); if(!p.author||!p.releaseNotes||!p.releaseNotesUrl||!p.installer?.url||!p.installer?.sha256Url||!Object.keys(p.dependencies||{}).length) process.exitCode=1"
          case "$PACKAGE_VERSION" in
            *-*) echo "Stable publish cannot use a prerelease version."; exit 1 ;;
            *) ;;
          esac
          if npm view "ytconv@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "ytconv@$PACKAGE_VERSION is already published; refusing to overwrite it."
            exit 1
          fi
      - name: Install and test clean package
        run: |
          npm install
          npm run check
          npm test
          npm run check:ish
          npm run test:ish
          npm publish --dry-run --tag latest
      - name: Build and verify exact release artifact
        id: package
        run: |
          npm pack --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/ytconv-pack.json"
          TARBALL=$(node -e "const p=require('$RUNNER_TEMP/ytconv-pack.json'); process.stdout.write(require('path').join('$RUNNER_TEMP',p[0].filename))")
          UNPACKED_SIZE=$(node -e "const p=require('$RUNNER_TEMP/ytconv-pack.json'); process.stdout.write(String(p[0].unpackedSize))")
          node ../scripts/ytconv-release-metadata.mjs \
            --package package.json \
            --tarball "$TARBALL" \
            --unpacked-size "$UNPACKED_SIZE" \
            --output "$RUNNER_TEMP/ytconv-$RELEASE_VERSION.metadata.json" \
            --verify "../release-metadata/ytconv-$RELEASE_VERSION.json"
          node -e "const p=require('$RUNNER_TEMP/ytconv-pack.json'); const bad=p[0].files.filter(f=>/\.(?:html|css|jsx|tsx)$/i.test(f.path)||/(?:^|\/)(?:next-app|public-ui|web|server)(?:\/|$)/i.test(f.path)||/(?:^|\/)(?:index|server)\.js$/i.test(f.path)); if(bad.length){console.error(bad);process.exit(1)}"
          echo "CLI-only package validation passed."
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "unpacked_size=$UNPACKED_SIZE" >> "$GITHUB_OUTPUT"
      - name: Publish stable package with provenance
        run: npm publish --tag latest --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify registry metadata and tarball
        id: registry
        run: |
          test "$(npm view ytconv@latest version --prefer-online)" = "$RELEASE_VERSION"
          npm view "ytconv@$RELEASE_VERSION" --json > "$RUNNER_TEMP/ytconv-registry.json"
          node -e "const p=require('$RUNNER_TEMP/ytconv-registry.json'); if(!p.author||!p.license||!p.time?.['$RELEASE_VERSION']||!p.dist?.tarball||!p.dist?.integrity||!p.dist?.unpackedSize||!p.maintainers?.length||!Object.keys(p.dependencies||{}).length||!p.releaseNotes) process.exitCode=1"
          TARBALL_URL=$(node -e "const p=require('$RUNNER_TEMP/ytconv-registry.json'); process.stdout.write(p.dist.tarball)")
          curl --fail --location --retry 5 "$TARBALL_URL" --output "$RUNNER_TEMP/ytconv-$RELEASE_VERSION.tgz"
          UNPACKED_SIZE=$(node -e "const p=require('$RUNNER_TEMP/ytconv-registry.json'); process.stdout.write(String(p.dist.unpackedSize))")
          node ../scripts/ytconv-release-metadata.mjs \
            --package package.json \
            --tarball "$RUNNER_TEMP/ytconv-$RELEASE_VERSION.tgz" \
            --unpacked-size "$UNPACKED_SIZE" \
            --output "$RUNNER_TEMP/ytconv-$RELEASE_VERSION.metadata.json" \
            --verify "../release-metadata/ytconv-$RELEASE_VERSION.json"
          SHA256=$(sha256sum "$RUNNER_TEMP/ytconv-$RELEASE_VERSION.tgz" | cut -d ' ' -f 1)
          printf '%s  %s\n' "$SHA256" "ytconv-$RELEASE_VERSION.tgz" > "$RUNNER_TEMP/SHA256SUMS.txt"
          npm view ytconv dist-tags --json
      - name: Create GitHub release with installer metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ytconv-v$RELEASE_VERSION"
          NOTES=$(node -p "require('./package.json').releaseNotes")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "$RUNNER_TEMP/ytconv-$RELEASE_VERSION.tgz" \
              "$RUNNER_TEMP/ytconv-$RELEASE_VERSION.metadata.json" \
              "$RUNNER_TEMP/SHA256SUMS.txt" --clobber
          else
            gh release create "$TAG" \
              "$RUNNER_TEMP/ytconv-$RELEASE_VERSION.tgz" \
              "$RUNNER_TEMP/ytconv-$RELEASE_VERSION.metadata.json" \
              "$RUNNER_TEMP/SHA256SUMS.txt" \
              --target "$GITHUB_SHA" \
              --title "YTConv CLI $RELEASE_VERSION" \
              --notes "$NOTES"
          fi
