# Final stable release: YTConv 1.6.2
name: Publish YTConv Stable to npm

on:
  push:
    branches:
      - release/ytconv-1.6.2-cli-only-final
    paths:
      - ".github/workflows/publish-ytconv-stable.yml"
      - "cli/**"
      - "scripts/ytconv-release-metadata.mjs"
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version; must match cli/package.json"
        required: true
        default: "1.6.2"
      confirm:
        description: "Type PUBLISH-STABLE to continue"
        required: true

permissions:
  actions: read
  contents: write
  id-token: write
  issues: write

concurrency:
  group: ytconv-npm-stable
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'push' || inputs.confirm == 'PUBLISH-STABLE' }}
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '1.6.2' }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Pin npm for the reproducible release tarball
        run: npm install -g npm@11.19.0
      - name: Verify stable package identity
        id: identity
        run: |
          test ! -f ../.github/workflows/ytconv-auth.yml
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_TAG=$(node -p "require('./package.json').publishConfig.tag")
          test "$PACKAGE_VERSION" = "$RELEASE_VERSION"
          test "$PACKAGE_VERSION" = "1.6.2"
          test "$PACKAGE_TAG" = "latest"
          test "$(node -p "require('./package.json').publisher")" = "Andhika Marcella Fernanda"
          test "$(node -p "require('./package.json').organization.name")" = "YTConv Project"
          test "$(node -p "require('./package.json').license")" = "MIT"
          test "$(node -p "require('./package.json').engines.node")" = ">=22.14.0"
          node -e "const p=require('./package.json'); if(!p.author||!p.maintainers?.length||!p.releaseNotes||!p.releaseNotesUrl||!p.installer?.url||!p.installer?.sha256Url||!p.documentation?.url||!p.documentation?.nodejs||!p.dependencies?.ws||p.dependencies?.['ffmpeg-static']||p.optionalDependencies||p.publishConfig?.provenance!==true) process.exitCode=1"
          test -f src/youtube-output.js
          test -f scripts/test-youtube-output.js
          grep -q 'music.youtube.com.*MP3' README.md
          grep -q 'regular YouTube.*MP4' README.md
          case "$PACKAGE_VERSION" in
            *-*) echo "Stable publish cannot use a prerelease version."; exit 1 ;;
            *) ;;
          esac
          if npm view "ytconv@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "ytconv@$PACKAGE_VERSION is already published; continuing with registry verification."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install test and audit the clean package
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test
          npm run check:ish
          npm run test:ish
          npm audit --omit=dev
          npm audit signatures
      - name: Prove a real public YouTube MP4 before publication
        env:
          NO_COLOR: "1"
          YTCONV_NO_UPDATE_CHECK: "1"
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          python3 -m pip install --user --break-system-packages -U 'yt-dlp[default]'
          node ./scripts/test-youtube-output.js
      - name: Build and validate the exact CLI-only tarball
        id: package
        run: |
          npm sbom --omit=dev --sbom-format cyclonedx > "$RUNNER_TEMP/ytconv-$RELEASE_VERSION.cdx.json"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/ytconv-pack.json"
          TARBALL=$(node -e "const p=require('$RUNNER_TEMP/ytconv-pack.json'); process.stdout.write(require('path').join('$RUNNER_TEMP',p[0].filename))")
          UNPACKED_SIZE=$(node -e "const p=require('$RUNNER_TEMP/ytconv-pack.json'); process.stdout.write(String(p[0].unpackedSize))")
          node -e "const p=require('$RUNNER_TEMP/ytconv-pack.json'); const bad=p[0].files.filter(f=>/\.(?:html|css|jsx|tsx)$/i.test(f.path)||/(?:^|\/)(?:next-app|public-ui|web|server)(?:\/|$)/i.test(f.path)); if(bad.length){console.error(bad);process.exit(1)}"
          node -e "const p=require('$RUNNER_TEMP/ytconv-pack.json')[0];const paths=new Set(p.files.map(f=>f.path));for(const required of ['src/youtube-output.js','docs/TROUBLESHOOTING.md','README.md'])if(!paths.has(required)){console.error('missing',required);process.exit(1)}"
          node ../scripts/ytconv-release-metadata.mjs \
            --package package.json \
            --tarball "$TARBALL" \
            --unpacked-size "$UNPACKED_SIZE" \
            --output "$RUNNER_TEMP/ytconv-$RELEASE_VERSION.metadata.json"
          LOCAL_SHA256=$(sha256sum "$TARBALL" | cut -d ' ' -f 1)
          printf '%s  %s\n' "$LOCAL_SHA256" "ytconv-$RELEASE_VERSION.tgz" > "$RUNNER_TEMP/SHA256SUMS.txt"
          echo "CLI-only package, output policy, and documentation validation passed."
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "sha256=$LOCAL_SHA256" >> "$GITHUB_OUTPUT"
      - name: Dry-run the exact tarball
        run: npm publish "${{ steps.package.outputs.tarball }}" --dry-run --tag latest --provenance
      - name: Publish stable package with provenance
        if: ${{ steps.identity.outputs.already_published != 'true' }}
        run: npm publish "${{ steps.package.outputs.tarball }}" --tag latest --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify registry metadata and exact downloaded tarball
        run: |
          REGISTRY_READY=false
          for ATTEMPT in $(seq 1 12); do
            LATEST_VERSION=$(npm view ytconv@latest version --prefer-online 2>/dev/null || true)
            PUBLISHED_VERSION=$(npm view "ytconv@$RELEASE_VERSION" version --prefer-online 2>/dev/null || true)
            if [ "$LATEST_VERSION" = "$RELEASE_VERSION" ] && [ "$PUBLISHED_VERSION" = "$RELEASE_VERSION" ]; then
              npm view "ytconv@$RELEASE_VERSION" --json --prefer-online > "$RUNNER_TEMP/ytconv-registry.json"
              if node -e "const p=require('$RUNNER_TEMP/ytconv-registry.json'); if(!p.author||!p.license||!p.time?.['$RELEASE_VERSION']||!p.dist?.tarball||!p.dist?.integrity||!p.dist?.unpackedSize||!p.maintainers?.length||!Object.keys(p.dependencies||{}).length||!p.releaseNotes||!p.documentation?.nodejs) process.exitCode=1"; then
                REGISTRY_READY=true
                break
              fi
            fi
            echo "Registry metadata is still propagating (attempt $ATTEMPT/12)."
            sleep 5
          done
          test "$REGISTRY_READY" = "true"
          TARBALL_URL=$(node -e "const p=require('$RUNNER_TEMP/ytconv-registry.json'); process.stdout.write(p.dist.tarball)")
          curl --fail --location --retry 5 "$TARBALL_URL" --output "$RUNNER_TEMP/ytconv-$RELEASE_VERSION.registry.tgz"
          REGISTRY_SHA256=$(sha256sum "$RUNNER_TEMP/ytconv-$RELEASE_VERSION.registry.tgz" | cut -d ' ' -f 1)
          test "$REGISTRY_SHA256" = "${{ steps.package.outputs.sha256 }}"
          UNPACKED_SIZE=$(node -e "const p=require('$RUNNER_TEMP/ytconv-registry.json'); process.stdout.write(String(p.dist.unpackedSize))")
          node ../scripts/ytconv-release-metadata.mjs \
            --package package.json \
            --tarball "$RUNNER_TEMP/ytconv-$RELEASE_VERSION.registry.tgz" \
            --unpacked-size "$UNPACKED_SIZE" \
            --output "$RUNNER_TEMP/ytconv-$RELEASE_VERSION.metadata.json"
      - name: Create GitHub release with checksum metadata and SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ytconv-v$RELEASE_VERSION"
          NOTES=$(node -p "require('./package.json').releaseNotes")
          ASSETS=(
            "${{ steps.package.outputs.tarball }}"
            "$RUNNER_TEMP/ytconv-$RELEASE_VERSION.metadata.json"
            "$RUNNER_TEMP/ytconv-$RELEASE_VERSION.cdx.json"
            "$RUNNER_TEMP/SHA256SUMS.txt"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "YTConv CLI $RELEASE_VERSION" \
              --notes "$NOTES"
          fi
      - name: Verify final stable channel
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test "$(npm view ytconv@latest version --prefer-online)" = "$RELEASE_VERSION"
          npm view ytconv dist-tags --json --prefer-online > "$RUNNER_TEMP/ytconv-tags.json"
          node -e "const t=require('$RUNNER_TEMP/ytconv-tags.json'); if(t.latest!=='$RELEASE_VERSION'){console.error(t);process.exit(1)}"
      - name: Report failed stable publish
        if: ${{ failure() }}
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOG_FILE="$RUNNER_TEMP/ytconv-publish-failed.log"
          BODY_FILE="$RUNNER_TEMP/ytconv-publish-failed.md"
          gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > "$LOG_FILE" 2>&1 || true
          tail -c 50000 "$LOG_FILE" > "$LOG_FILE.trimmed"
          {
            echo "The automated YTConv $RELEASE_VERSION stable publication failed."
            echo
            echo "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo
            echo '```text'
            cat "$LOG_FILE.trimmed"
            echo '```'
          } > "$BODY_FILE"
          ISSUE_NUMBER=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "YTConv $RELEASE_VERSION publish failed in:title" --json number --jq '.[0].number // empty')
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$BODY_FILE"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "YTConv $RELEASE_VERSION publish failed" --body-file "$BODY_FILE"
          fi
