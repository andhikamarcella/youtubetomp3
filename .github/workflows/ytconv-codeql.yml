name: YTConv CodeQL Security

on:
  push:
    branches:
      - "release/ytconv-1.6.0*"
    paths:
      - "cli/**"
      - ".github/workflows/ytconv-codeql.yml"
  pull_request:
    paths:
      - "cli/**"
      - ".github/workflows/ytconv-codeql.yml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ytconv-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Install without lifecycle scripts
        working-directory: cli
        run: npm ci --ignore-scripts
      - name: Run syntax and unit tests
        working-directory: cli
        run: |
          npm run check
          npm test
      - name: Analyze
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
