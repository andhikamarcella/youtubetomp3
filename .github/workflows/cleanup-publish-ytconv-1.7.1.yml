name: Cleanup YTConv 1.7.1 Publication Trigger

on:
  push:
    branches:
      - release/ytconv-1.7.1
    paths:
      - .github/release-markers/cleanup-publish-ytconv-1.7.1

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/ytconv-1.7.1

      - name: Restore manual-only publication workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/publish-ytconv.yml')
          text = workflow.read_text()
          push_block = """  push:\n    branches:\n      - release/ytconv-1.7.1\n    paths:\n      - .github/release-markers/publish-ytconv-1.7.1\n"""
          text = text.replace(push_block, '')
          text = text.replace(
              "if: ${{ github.ref_name == 'release/ytconv-1.7.1' && (github.event_name == 'push' || inputs.confirm == true) }}",
              "if: ${{ inputs.confirm == true && github.ref_name == 'release/ytconv-1.7.1' }}",
          )
          workflow.write_text(text)
          PY
          rm -f .github/release-markers/publish-ytconv-1.7.1
          rm -f .github/release-markers/cleanup-publish-ytconv-1.7.1
          rm -f .github/workflows/cleanup-publish-ytconv-1.7.1.yml

      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/publish-ytconv.yml .github/workflows/cleanup-publish-ytconv-1.7.1.yml .github/release-markers
          git commit -m "chore: restore manual YTConv publication workflow"
          git push origin HEAD:release/ytconv-1.7.1
