name: Publish YTConv 1.6.5 with npm token

on:
  push:
    branches:
      - codex/perbaiki-semua-fungsi-tombol
    paths:
      - ".github/release-markers/ytconv-1.6.5-token"

permissions:
  actions: read
  contents: write
  id-token: write
  issues: write

concurrency:
  group: ytconv-publish-1.6.5-token
  cancel-in-progress: false

jobs:
  publish:
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: cli
    env:
      VERSION: 1.6.5
      TAG: ytconv-v1.6.5
      SOURCE_REF: release/ytconv-1.6.5-packages
      SOURCE_SHA: 98c79c16b377857e4e8a7874be47e9361d41f1dc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 98c79c16b377857e4e8a7874be47e9361d41f1dc
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install exact graph without lifecycle scripts
        run: |
          npm install -g npm@11.18.0
          npm ci --ignore-scripts
      - name: Verify exact release source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          test "$(node -p "require('./package.json').publishConfig.tag")" = "latest"
          test "$(node -p "require('./package.json').license")" = "ISC"
          test "$(cat ish/VERSION)" = "$VERSION"
          node -e "const p=require('./package.json');if(p.scripts.preinstall||p.scripts.install||p.scripts.postinstall)process.exit(1)"
      - name: Locate successful package matrix
        id: matrix
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DATA=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ytconv-packages.yml/runs" \
            -f branch="$SOURCE_REF" -f head_sha="$SOURCE_SHA" -f event=push -f status=success -f per_page=20)
          RUN_ID=$(printf '%s' "$DATA" | jq -r '.workflow_runs[0].id // empty')
          test -n "$RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Download and consolidate verified native artifacts
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ steps.matrix.outputs.run_id }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/native-artifacts"
          RELEASE="$RUNNER_TEMP/release-assets"
          rm -rf "$ROOT" "$RELEASE"
          mkdir -p "$ROOT" "$RELEASE"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --dir "$ROOT"
          for REQUIRED in \
            'YTConv-1.6.5-Setup-x64.exe' \
            'YTConv-1.6.5-portable-win-x64.zip' \
            'YTConv-1.6.5-debug.apk' \
            'YTConv-1.6.5-release-unsigned.apk' \
            'YTConv-Android-1.6.5-source.tar.gz' \
            'ytconv_1.6.5_amd64.deb' \
            'ytconv_1.6.5_arm64.deb' \
            'ytconv-1.6.5-1.x86_64.rpm' \
            'ytconv-1.6.5-1.aarch64.rpm' \
            'ytconv-1.6.5-1-x86_64.pkg.tar.zst' \
            'ytconv-1.6.5-1-aarch64.pkg.tar.zst' \
            'ytconv-1.6.5-r0.apk' \
            'YTConv-1.6.5-x86_64.AppImage' \
            'ytconv_1.6.5_amd64.snap' \
            'YTConv-1.6.5.flatpak' \
            'ytconv_1.6.5_all-termux.deb'; do
            FILE=$(find "$ROOT" -type f -name "$REQUIRED" -print -quit)
            test -n "$FILE"
            test -s "$FILE"
          done
          while IFS= read -r -d '' FILE; do
            BASE=$(basename "$FILE")
            case "$BASE" in SHA256SUMS*.txt) continue ;; esac
            if [ -e "$RELEASE/$BASE" ]; then
              test "$(sha256sum "$RELEASE/$BASE" | cut -d ' ' -f 1)" = "$(sha256sum "$FILE" | cut -d ' ' -f 1)"
            else
              cp "$FILE" "$RELEASE/$BASE"
            fi
          done < <(find "$ROOT" -type f -print0)
      - name: Build exact npm tarball SBOM and checksums
        id: package
        run: |
          RELEASE="$RUNNER_TEMP/release-assets"
          npm sbom --omit=dev --sbom-format cyclonedx > "$RELEASE/ytconv-$VERSION.cdx.json"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/ytconv-pack.json"
          SOURCE=$(node -e "const p=require('$RUNNER_TEMP/ytconv-pack.json')[0];process.stdout.write(require('path').join('$RUNNER_TEMP',p.filename))")
          cp "$SOURCE" "$RELEASE/ytconv-$VERSION.tgz"
          node -e "const p=require('$RUNNER_TEMP/ytconv-pack.json')[0];const bad=p.files.filter(f=>/\.(?:html|css|jsx|tsx)$/i.test(f.path)||/(?:^|\/)(?:next-app|public-ui|web|server|android-app|packaging)(?:\/|$)/i.test(f.path));if(bad.length){console.error(bad);process.exit(1)}"
          SHA256=$(sha256sum "$RELEASE/ytconv-$VERSION.tgz" | cut -d ' ' -f 1)
          cd "$RELEASE"
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          echo "tarball=$RELEASE/ytconv-$VERSION.tgz" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
      - name: Create or update GitHub Release and upload every artifact
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE="$RUNNER_TEMP/release-assets"
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          YTConv 1.6.5 adds Windows EXE installer and portable ZIP, Android APK builds and corresponding source, DEB/RPM/Arch packages for x86_64 and ARM64, Alpine APK, AppImage, Snap, Flatpak, Termux DEB, portable Linux archives, Nix metadata, consolidated SHA-256 checksums, CycloneDX SBOM, and the exact npm tarball.

          iSH and Alpine update/install paths were repaired and synchronized to 1.6.5. The npm package remains CLI-only and ISC licensed, with no install lifecycle scripts.

          Store acceptance is not claimed. The Android release APK is unsigned; the debug APK is installable for testing.
          NOTES
          mapfile -d '' ASSETS < <(find "$RELEASE" -maxdepth 1 -type f -print0 | sort -z)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "YTConv 1.6.5 — Native Packages" --notes-file "$RUNNER_TEMP/release-notes.md" --target "$SOURCE_SHA"
            gh release upload "$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "YTConv 1.6.5 — Native Packages" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          fi
      - name: Publish exact tarball to npm latest with environment token and provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN"
          if npm view "ytconv@$VERSION" version --prefer-online >/dev/null 2>&1; then
            echo "ytconv@$VERSION already exists; skipping immutable publish."
          else
            npm publish "${{ steps.package.outputs.tarball }}" --tag latest --access public --provenance
          fi
      - name: Verify npm latest and registry bytes
        run: |
          READY=false
          for ATTEMPT in $(seq 1 24); do
            REGISTRY_VERSION=$(npm view ytconv@latest version --prefer-online 2>/dev/null || true)
            if [ "$REGISTRY_VERSION" = "$VERSION" ]; then READY=true; break; fi
            sleep 5
          done
          test "$READY" = "true"
          URL=$(npm view "ytconv@$VERSION" dist.tarball --prefer-online)
          curl --fail --location --retry 5 "$URL" -o "$RUNNER_TEMP/ytconv-$VERSION.registry.tgz"
          test "$(sha256sum "$RUNNER_TEMP/ytconv-$VERSION.registry.tgz" | cut -d ' ' -f 1)" = "${{ steps.package.outputs.sha256 }}"
      - name: Confirm publication in release notes and issues
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat >> "$RUNNER_TEMP/release-notes.md" <<'NOTES'

          npm publication: `ytconv@1.6.5` is the verified `latest` version. Registry tarball bytes match the SHA-256 of the tarball attached to this release.
          NOTES
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          gh issue comment 180 --repo "$GITHUB_REPOSITORY" --body "YTConv 1.6.5 was published to npm latest and GitHub Release **ytconv-v1.6.5**. The release includes Windows EXE/ZIP, Android APK/source, DEB, RPM, Arch, Alpine APK, AppImage, Snap, Flatpak, Termux, ARM64 packages, portable archives, SBOM, and SHA-256 checksums. npm registry bytes were verified in run $GITHUB_RUN_ID."
          gh issue comment 181 --repo "$GITHUB_REPOSITORY" --body "Resolved in run $GITHUB_RUN_ID by explicitly mapping the environment npm secret NPM_TOKEN to NODE_AUTH_TOKEN. npm latest and registry bytes were verified, and the GitHub Release assets were uploaded."
      - name: Report retry failure
        if: ${{ failure() }}
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 181 --repo "$GITHUB_REPOSITORY" --body "Token-based retry failed in https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Inspect the failed step before claiming publication." || true
