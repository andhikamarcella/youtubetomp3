name: Remove redundant YTConv runner dependencies

on:
  push:
    branches:
      - agent/ytconv-1.6.2-youtube-output-fix
    paths:
      - .github/workflows/fix-ytconv-1.6.2-runner-dependencies.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ytconv-1.6.2-youtube-output-fix
      - name: Use preinstalled Ubuntu runner media tools
        run: |
          python3 <<'PY'
          from pathlib import Path
          ci = Path('.github/workflows/ytconv-cli.yml')
          text = ci.read_text(encoding='utf-8')
          text = text.replace("      - run: sudo apt-get update && sudo apt-get install -y ffmpeg python3-pip\n", "      - run: ffmpeg -version && ffprobe -version && python3 -m pip --version\n")
          ci.write_text(text, encoding='utf-8')

          publish = Path('.github/workflows/publish-ytconv-stable.yml')
          text = publish.read_text(encoding='utf-8')
          text = text.replace("          sudo apt-get update\n          sudo apt-get install -y ffmpeg python3-pip\n", "          ffmpeg -version\n          ffprobe -version\n          python3 -m pip --version\n")
          publish.write_text(text, encoding='utf-8')
          PY
      - name: Verify workflow replacements
        run: |
          ! grep -q 'apt-get' .github/workflows/ytconv-cli.yml
          ! grep -q 'apt-get' .github/workflows/publish-ytconv-stable.yml
          grep -q 'ffprobe -version' .github/workflows/ytconv-cli.yml
          grep -q 'ffprobe -version' .github/workflows/publish-ytconv-stable.yml
      - name: Commit the workflow fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ytconv-cli.yml .github/workflows/publish-ytconv-stable.yml
          git commit -m "ci(cli): use preinstalled media tools for real YouTube proof"
          git push origin HEAD:agent/ytconv-1.6.2-youtube-output-fix
