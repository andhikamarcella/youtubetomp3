name: Publish final YTConv 1.6.8 release

on:
  push:
    branches:
      - codex/perbaiki-semua-fungsi-tombol
    paths:
      - ".github/release-markers/publish-ytconv-1.6.8-final"

permissions:
  actions: read
  contents: write
  id-token: write
  issues: write

concurrency:
  group: publish-final-ytconv-1.6.8
  cancel-in-progress: false

jobs:
  publish:
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      VERSION: 1.6.8
      TAG: ytconv-v1.6.8
      SOURCE_SHA: 5f92736ea1f3208203877731b907acdbf7ce7b41
      VALIDATED_HEAD_SHA: 9ec6df39e761fd457b98201420a897034611ebc3
      NATIVE_RUN: 30999882464
    steps:
      - name: Checkout immutable final source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5f92736ea1f3208203877731b907acdbf7ce7b41
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install exact development graph without lifecycle scripts
        working-directory: cli
        run: |
          npm install -g npm@11.18.0
          npm ci --ignore-scripts

      - name: Verify immutable 1.6.8 source identity
        working-directory: cli
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --quiet "$VALIDATED_HEAD_SHA" "$SOURCE_SHA" -- .
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          test "$(node -p "require('./package.json').license")" = "ISC"
          test "$(cat ish/VERSION)" = "$VERSION"
          node --input-type=module - <<'NODE'
          const fs = await import('node:fs/promises');
          const manifest = JSON.parse(await fs.readFile('./package.json', 'utf8'));
          const expected = {
            commander: '14.0.3',
            figlet: '1.11.4',
            ink: '7.1.1',
            isexe: '3.1.5',
            react: '19.2.8',
            which: '6.0.0',
            ws: '8.21.1',
          };
          if (JSON.stringify(manifest.dependencies) !== JSON.stringify(expected)) {
            throw new Error(`unexpected runtime dependencies: ${JSON.stringify(manifest.dependencies)}`);
          }
          for (const hook of ['preinstall', 'install', 'postinstall']) {
            if (manifest.scripts?.[hook]) throw new Error(`forbidden install hook: ${hook}`);
          }
          if (manifest.securityCapabilities?.telemetry !== false) throw new Error('telemetry must remain disabled');
          if (manifest.publishConfig?.tag !== 'latest') throw new Error('npm tag must be latest');
          if (manifest.releaseDate !== '2026-08-05') throw new Error('release date mismatch');
          NODE

      - name: Run exact release validation
        working-directory: cli
        run: |
          npm run check
          npm run typecheck
          npm test
          npm run check:ish
          PYTHONWARNINGS=error::ResourceWarning npm run test:ish
          npm run security

      - name: Download validated native artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/native-artifacts"
          RELEASE="$RUNNER_TEMP/release-assets"
          rm -rf "$ROOT" "$RELEASE"
          mkdir -p "$ROOT" "$RELEASE"
          gh run download "$NATIVE_RUN" --repo "$GITHUB_REPOSITORY" --dir "$ROOT"
          for REQUIRED in \
            'YTConv-1.6.8-Setup-x64.exe' \
            'YTConv-1.6.8-portable-win-x64.zip' \
            'YTConv-1.6.8-debug.apk' \
            'YTConv-1.6.8-release-unsigned.apk' \
            'YTConv-Android-1.6.8-source.tar.gz' \
            'ytconv_1.6.8_amd64.deb' \
            'ytconv_1.6.8_arm64.deb' \
            'ytconv-1.6.8-1.x86_64.rpm' \
            'ytconv-1.6.8-1.aarch64.rpm' \
            'ytconv-1.6.8-1-x86_64.pkg.tar.zst' \
            'ytconv-1.6.8-1-aarch64.pkg.tar.zst' \
            'ytconv-1.6.8-r0.apk' \
            'YTConv-1.6.8-x86_64.AppImage' \
            'ytconv_1.6.8_amd64.snap' \
            'YTConv-1.6.8.flatpak' \
            'ytconv_1.6.8_all-termux.deb' \
            'YTConv-1.6.8-linux-x86_64.tar.gz' \
            'YTConv-1.6.8-linux-aarch64.tar.gz' \
            'dist-flake.lock'; do
            FILE=$(find "$ROOT" -type f -name "$REQUIRED" -print -quit)
            test -n "$FILE"
            test -s "$FILE"
          done
          while IFS= read -r -d '' FILE; do
            BASE=$(basename "$FILE")
            case "$BASE" in SHA256SUMS*.txt) continue ;; esac
            if [ -e "$RELEASE/$BASE" ]; then
              test "$(sha256sum "$RELEASE/$BASE" | cut -d ' ' -f 1)" = "$(sha256sum "$FILE" | cut -d ' ' -f 1)"
            else
              cp "$FILE" "$RELEASE/$BASE"
            fi
          done < <(find "$ROOT" -type f -print0)

      - name: Build exact npm tarball and SBOM
        id: package
        working-directory: cli
        run: |
          RELEASE="$RUNNER_TEMP/release-assets"
          npm sbom --omit=dev --sbom-format cyclonedx > "$RELEASE/ytconv-$VERSION.cdx.json"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/ytconv-pack.json"
          SOURCE=$(node -e "const p=require('$RUNNER_TEMP/ytconv-pack.json')[0];process.stdout.write(require('path').join('$RUNNER_TEMP',p.filename))")
          cp "$SOURCE" "$RELEASE/ytconv-$VERSION.tgz"
          node - <<'NODE'
          const fs = require('node:fs');
          const pack = require(process.env.RUNNER_TEMP + '/ytconv-pack.json')[0];
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (manifest.version !== process.env.VERSION) throw new Error('packed version mismatch');
          const bad = pack.files.filter((file) =>
            /(?:^|\/)node_modules(?:\/|$)/u.test(file.path)
            || /(?:^|\.)min\.(?:c?js|mjs)$/iu.test(file.path)
            || /\.(?:c?js|mjs)\.map$/iu.test(file.path)
            || /\.(?:exe|dll|dylib|so|node|wasm|jar|class)$/iu.test(file.path)
            || /\.(?:html|css|jsx|tsx)$/iu.test(file.path));
          if (bad.length) throw new Error(JSON.stringify(bad, null, 2));
          NODE
          SHA256=$(sha256sum "$RELEASE/ytconv-$VERSION.tgz" | cut -d ' ' -f 1)
          echo "tarball=$RELEASE/ytconv-$VERSION.tgz" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Create and verify consolidated SHA-256 checksums
        run: |
          cd "$RUNNER_TEMP/release-assets"
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Publish npm latest with provenance
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_SHA: ${{ env.SOURCE_SHA }}
        run: |
          test -n "${NODE_AUTH_TOKEN:-}"
          if npm view "ytconv@$VERSION" version --prefer-online >/dev/null 2>&1; then
            echo "ytconv@$VERSION already exists; preserving immutable package bytes."
            npm dist-tag add "ytconv@$VERSION" latest
          else
            npm publish "${{ steps.package.outputs.tarball }}" --tag latest --access public --provenance
          fi

      - name: Verify npm latest and registry bytes
        working-directory: cli
        run: |
          READY=false
          for ATTEMPT in $(seq 1 36); do
            REGISTRY_VERSION=$(npm view ytconv@latest version --prefer-online 2>/dev/null || true)
            if [ "$REGISTRY_VERSION" = "$VERSION" ]; then READY=true; break; fi
            echo "Waiting for npm propagation ($ATTEMPT/36)..."
            sleep 5
          done
          test "$READY" = true
          URL=$(npm view "ytconv@$VERSION" dist.tarball --prefer-online)
          curl --fail --location --retry 5 "$URL" -o "$RUNNER_TEMP/ytconv-$VERSION.registry.tgz"
          test "$(sha256sum "$RUNNER_TEMP/ytconv-$VERSION.registry.tgz" | cut -d ' ' -f 1)" = "${{ steps.package.outputs.sha256 }}"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE="$RUNNER_TEMP/release-assets"
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          YTConv 1.6.8 is a maintenance release that preserves the responsive Figlet identity, Commander-powered command help, exact which/isexe executable discovery, and animated checking, downloading, conversion, merge, extraction, remux, and thumbnail progress from 1.6.7.

          Subtitles remain disabled by default. Public access is attempted first, while official browser-login recovery is offered only after authentication or cookie-related provider failures. Social-media support covers YouTube, Instagram, Facebook, TikTok, X/Twitter, Pinterest, Reddit, Threads, Twitch, SoundCloud, Vimeo, Bilibili, Telegram, LinkedIn, Bluesky, and other providers supported by yt-dlp or gallery-dl.

          The Android app is updated to versionName 1.6.8, versionCode 10608, and 2026 visible metadata, with AUTO, MP4, MP3, and image modes, progress, cancellation, output verification, and temporary local WebView cookie recovery.

          Assets include Windows EXE/ZIP, Android APK/source, DEB, RPM, Arch, Alpine APK, AppImage, Snap, Flatpak, Termux, ARM64 packages, portable Linux archives, Nix lock data, CycloneDX SBOM, the exact npm tarball, and consolidated SHA-256 checksums. The Android release APK is unsigned; the debug APK is installable for testing.
          NOTES
          mapfile -d '' ASSETS < <(find "$RELEASE" -maxdepth 1 -type f -print0 | sort -z)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
              --title "YTConv 1.6.8 — Maintenance and Release Refresh" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --latest
            gh release upload "$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" --latest \
              --title "YTConv 1.6.8 — Maintenance and Release Refresh" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Report success
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 183 --repo "$GITHUB_REPOSITORY" --body "✅ YTConv 1.6.8 published. npm latest and registry bytes were verified; GitHub Release **ytconv-v1.6.8** contains native artifacts, SBOM, npm tarball, and SHA-256 checksums. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Report failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "YTConv 1.6.8 final publication failed" \
            --body "Publication failed in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Do not claim success until npm latest, registry-byte verification, and GitHub Release creation complete." || true
