name: Diagnose YTConv 1.6.2 real smoke

on:
  push:
    branches:
      - agent/ytconv-1.6.2-youtube-output-fix
    paths:
      - .github/workflows/diagnose-ytconv-1.6.2-real-smoke.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ytconv-1.6.2-youtube-output-fix
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: python3 -m pip install --user --break-system-packages -U 'yt-dlp[default]' >/dev/null
      - run: cd cli && npm ci --ignore-scripts >/dev/null
      - name: Capture concise failure
        shell: bash
        run: |
          set +e
          cd cli
          NO_COLOR=1 YTCONV_NO_UPDATE_CHECK=1 node ./scripts/test-youtube-output.js > ../ytconv-1.6.2-real-smoke.log 2>&1
          STATUS=$?
          cd ..
          {
            echo "exit_status=$STATUS"
            echo "node=$(node --version)"
            echo "yt_dlp=$(python3 -m yt_dlp --version 2>&1)"
            echo "--- smoke output ---"
            tail -n 200 ytconv-1.6.2-real-smoke.log
          } > ytconv-1.6.2-real-smoke.txt
          rm -f ytconv-1.6.2-real-smoke.log
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ytconv-1.6.2-real-smoke.txt
          git commit -m "test(cli): capture concise 1.6.2 smoke failure"
          git push origin HEAD:agent/ytconv-1.6.2-youtube-output-fix
