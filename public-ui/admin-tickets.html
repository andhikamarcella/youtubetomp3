<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin Tickets - YTConv</title>
<style>body{font-family:Arial;background:#0b1220;color:#e5e7eb;padding:20px} table{width:100%;border-collapse:collapse} td,th{border:1px solid #374151;padding:8px;vertical-align:top} input,select,textarea,button{background:#111827;color:#fff;border:1px solid #374151;border-radius:6px;padding:6px} .wrap{max-width:1200px;margin:auto}</style></head>
<body><div class="wrap"><h2>📋 Dashboard Laporan Admin</h2><div style="display:flex;gap:8px;margin-bottom:10px"><input id="token" placeholder="Bearer token admin" style="min-width:280px"><button onclick="loadTickets()">Muat Tiket</button></div><table><thead><tr><th>ID</th><th>Pengirim</th><th>Kategori</th><th>Pesan</th><th>Status</th><th>Balas Admin</th><th>Aksi</th></tr></thead><tbody id="rows"></tbody></table></div>
<script>
async function loadTickets(){const token=document.getElementById('token').value.trim();const r=await fetch('/api/admin/tickets',{headers:{Authorization:`Bearer ${token}`}});const d=await r.json();const tb=document.getElementById('rows');tb.innerHTML='';if(!r.ok||!d.ok){tb.innerHTML=`<tr><td colspan='7'>${d.error||'Unauthorized'}</td></tr>`;return;}d.tickets.forEach(t=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${t.ticketId}</td><td>${t.name}<br><small>${t.email}</small></td><td>${t.category}</td><td>${(t.message||'').slice(0,160)}</td><td><select id='st-${t.ticketId}'><option value='received'>Diterima</option><option value='reviewing'>Diproses</option><option value='waiting_user'>Menunggu User</option><option value='resolved'>Selesai</option><option value='rejected'>Ditolak</option></select></td><td><textarea id='rp-${t.ticketId}' rows='3' placeholder='Balasan admin ke user...'>${t.adminReply||''}</textarea></td><td><button onclick="updateTicket('${t.ticketId}')">Update</button><div><a href='/ticket/${t.ticketId}' target='_blank'>Lihat status</a></div></td>`;tb.appendChild(tr);const sel=tr.querySelector(`#st-${t.ticketId}`);if(sel)sel.value=t.status||'received';});}
async function updateTicket(id){const token=document.getElementById('token').value.trim();const status=document.getElementById(`st-${id}`).value;const adminReply=document.getElementById(`rp-${id}`).value;const r=await fetch(`/api/admin/tickets/${encodeURIComponent(id)}`,{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify({status,adminReply})});const d=await r.json();alert(d.ok?'Update berhasil & email user terkirim':'Gagal: '+(d.error||'unknown'));if(d.ok)loadTickets();}
setInterval(()=>{if(document.getElementById('token').value.trim())loadTickets();},8000);
</script></body></html>
