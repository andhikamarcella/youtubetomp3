  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at top, rgba(13,110,253,.35), transparent 55%), radial-gradient(circle at bottom, rgba(25,135,84,.28), transparent 60%), linear-gradient(180deg, rgba(13,17,23,.92) 0%, rgba(13,17,23,.65) 100%); padding: 1.5rem; font-family: "Comfortaa", "Comforta", "Trebuchet MS", system-ui, sans-serif; letter-spacing: .01em; }
    code, kbd, pre, samp, .font-monospace { font-family: "IBM Plex Mono", "Comforta", "Courier New", monospace; font-feature-settings: "tnum" 1; }
    .player-card { max-width: 540px; border-radius: 1.25rem; overflow: hidden; }
    .eq-slider label { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--bs-secondary); }
    .eq-slider .form-range { height: 1.25rem; appearance: none; background: linear-gradient(90deg, rgba(13,110,253,.28) 0%, rgba(111,66,193,.38) 55%, rgba(220,53,69,.32) 100%); border-radius: 999px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), 0 6px 18px rgba(13,110,253,.18); transition: box-shadow .2s ease, background .2s ease; touch-action: pan-y; }
    .eq-slider .form-range:focus-visible { outline: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.2), 0 0 0 .35rem rgba(13,110,253,.25); }
    .eq-slider .form-range::-webkit-slider-runnable-track { height: .5rem; border-radius: 999px; background: transparent; }
    .eq-slider .form-range::-moz-range-track { height: .5rem; border-radius: 999px; background: transparent; }
    .eq-slider .form-range::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #ffffff 0%, rgba(255,255,255,.65) 40%, rgba(13,110,253,1) 100%); border: 2px solid rgba(255,255,255,.85); box-shadow: 0 0 12px rgba(13,110,253,.55), 0 4px 10px rgba(23,35,63,.25); margin-top: -6px; transition: transform .15s ease, box-shadow .2s ease; }
    .eq-slider .form-range::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #ffffff 0%, rgba(255,255,255,.65) 40%, rgba(13,110,253,1) 100%); border: 2px solid rgba(255,255,255,.85); box-shadow: 0 0 12px rgba(13,110,253,.55), 0 4px 10px rgba(23,35,63,.25); transition: transform .15s ease, box-shadow .2s ease; }
    .eq-slider .form-range:active::-webkit-slider-thumb, .eq-slider .form-range:active::-moz-range-thumb { transform: scale(1.08); box-shadow: 0 0 18px rgba(111,66,193,.55), 0 6px 14px rgba(23,35,63,.3); }
    .eq-slider .eq-value { font-size: .72rem; font-weight: 600; background: color-mix(in srgb, var(--bs-primary) 25%, transparent); color: rgba(255,255,255,.92); border-radius: .65rem; padding: .2rem .45rem; min-width: 3.4rem; text-align: center; }
    .range-control { display: flex; align-items: center; gap: .5rem; }
    .range-control .form-range { flex: 1 1 auto; min-width: 0; touch-action: pan-y; }
    .range-control .btn-range { flex: 0 0 auto; width: 2.4rem; height: 2.4rem; border-radius: .7rem; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.05rem; border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.08); color: rgba(255,255,255,.92); transition: transform .15s ease, box-shadow .2s ease, background .2s ease; }
    .range-control .btn-range:focus-visible { outline: 3px solid rgba(13,110,253,.5); outline-offset: 2px; }
    .range-control .btn-range:active { transform: scale(.94); box-shadow: inset 0 0 0 1px rgba(23,35,63,.2); }
    .range-control .btn-range i { pointer-events: none; }
    @media (max-width: 576px) {
      .range-control .btn-range { width: 2.2rem; height: 2.2rem; font-size: 1rem; }
    }
    .muted { color: var(--bs-secondary); }

    /* Global Button Animations */
    button, .btn, .btn-range {
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
    }
    button:not(:disabled):hover, .btn:not(:disabled):not(.disabled):hover, .btn-range:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    button:not(:disabled):active, .btn:not(:disabled):not(.disabled):active, .btn-range:active {
      transform: scale(0.95) translateY(0);
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <div class="card shadow-lg player-card bg-body">
    <div class="card-body p-4">
      <div class="d-flex align-items-center mb-3">
        <i class="bi bi-soundwave text-primary me-2 fs-4"></i>
        <div>
          <div class="fw-semibold" id="trackTitle">Memuat…</div>
          <div class="small muted" id="trackMeta">Mini player siap diputar.</div>
        </div>
      </div>
      <audio id="shareAudio" class="w-100 mb-3" controls preload="auto"></audio>
      <div class="alert alert-info d-flex flex-wrap align-items-center gap-2" role="status" id="statusAlert" hidden></div>
      <div class="border rounded p-3 mb-3 bg-body-secondary">
        <div class="d-flex align-items-center justify-content-between mb-2">
          <strong>Equalizer</strong>
          <div class="btn-group btn-group-sm" role="group">
            <button class="btn btn-outline-light" id="eqShareFlat">Flat</button>
            <button class="btn btn-outline-light" id="eqShareWarm">Warm</button>
            <button class="btn btn-outline-light" id="eqShareBright">Bright</button>
          </div>
        </div>
        <div class="row g-2 eq-slider">
          <div class="col-12 col-sm-4">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <label class="form-label mb-0" for="eqShareBass">Bass</label>
              <span class="eq-value" id="eqShareBassValue">0 dB</span>
            </div>
            <div class="range-control" data-range-wrapper>
              <button class="btn-range" type="button" data-range-step="-1" aria-label="Turunkan gain bass"><i class="bi bi-dash-lg"></i></button>
              <input type="range" class="form-range" id="eqShareBass" min="-12" max="12" step="1" value="0">
              <button class="btn-range" type="button" data-range-step="1" aria-label="Naikkan gain bass"><i class="bi bi-plus-lg"></i></button>
            </div>
          </div>
          <div class="col-12 col-sm-4">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <label class="form-label mb-0" for="eqShareMid">Mid</label>
              <span class="eq-value" id="eqShareMidValue">0 dB</span>
            </div>
            <div class="range-control" data-range-wrapper>
              <button class="btn-range" type="button" data-range-step="-1" aria-label="Turunkan gain mid"><i class="bi bi-dash-lg"></i></button>
              <input type="range" class="form-range" id="eqShareMid" min="-12" max="12" step="1" value="0">
              <button class="btn-range" type="button" data-range-step="1" aria-label="Naikkan gain mid"><i class="bi bi-plus-lg"></i></button>
            </div>
          </div>
          <div class="col-12 col-sm-4">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <label class="form-label mb-0" for="eqShareTreble">Treble</label>
              <span class="eq-value" id="eqShareTrebleValue">0 dB</span>
            </div>
            <div class="range-control" data-range-wrapper>
              <button class="btn-range" type="button" data-range-step="-1" aria-label="Turunkan gain treble"><i class="bi bi-dash-lg"></i></button>
              <input type="range" class="form-range" id="eqShareTreble" min="-12" max="12" step="1" value="0">
              <button class="btn-range" type="button" data-range-step="1" aria-label="Naikkan gain treble"><i class="bi bi-plus-lg"></i></button>
            </div>
          </div>
        </div>
        <div class="small text-secondary mt-2" id="eqShareStatus">Flat</div>
      </div>
      <div class="d-flex flex-wrap gap-2">
        <a class="btn btn-primary flex-grow-1" id="downloadBtn" href="#" download>
          <i class="bi bi-download me-1"></i>Download
        </a>
        <button class="btn btn-outline-light" id="shareBtn" type="button"><i class="bi bi-share me-1"></i>Bagikan</button>
        <button class="btn btn-outline-light" id="copyBtn" type="button"><i class="bi bi-clipboard"></i></button>
      </div>
      <div class="mt-4 text-center" id="shareQrWrap" hidden>
        <canvas id="shareQr" width="156" height="156" class="border rounded bg-body"></canvas>
        <div class="small muted mt-2"><i class="bi bi-qr-code"></i> Scan untuk membuka halaman ini di perangkat lain.</div>
      </div>
    </div>
  </div>

  <script src="./vendor/qrcode.js" defer data-qr-lib="local"></script>
  <script>
  (function(){
    const params = new URLSearchParams(location.search);
    const audioSrc = params.get('src');
    const trackName = params.get('name') || params.get('title') || 'Audio hasil convert';
    const fmt = params.get('fmt') || '';
    const srParam = Number(params.get('sr') || 0);
    const chParam = Number(params.get('ch') || 0);
    const audioEl = document.getElementById('shareAudio');
    const titleEl = document.getElementById('trackTitle');
    const metaEl = document.getElementById('trackMeta');
    const alertEl = document.getElementById('statusAlert');
    const downloadBtn = document.getElementById('downloadBtn');
    const shareBtn = document.getElementById('shareBtn');
    const copyBtn = document.getElementById('copyBtn');
    const qrWrap = document.getElementById('shareQrWrap');
    const qrCanvas = document.getElementById('shareQr');
    const eqInputs = {
      bass: document.getElementById('eqShareBass'),
      mid: document.getElementById('eqShareMid'),
      treble: document.getElementById('eqShareTreble'),
    };
    const eqValues = {
      bass: document.getElementById('eqShareBassValue'),
      mid: document.getElementById('eqShareMidValue'),
      treble: document.getElementById('eqShareTrebleValue'),
    };
    const eqStatus = document.getElementById('eqShareStatus');
    const eqPresetFlat = document.getElementById('eqShareFlat');
    const eqPresetWarm = document.getElementById('eqShareWarm');
    const eqPresetBright = document.getElementById('eqShareBright');
    let audioCtx = null;
    let sourceNode = null;
    let filters = [];
    let qrLibPromise = null;

    const formatGain = (v) => {
      const num = Number(v) || 0;
      return `${num >= 0 ? '+' : ''}${num} dB`;
    };

    const updateEqTrack = (input) => {
      if (!input) return;
      const min = Number(input.min || -12);
      const max = Number(input.max || 12);
      const val = Number(input.value || 0);
      const range = max - min || 1;
      const rawValuePercent = ((val - min) / range) * 100;
      const rawZeroPercent = ((0 - min) / range) * 100;
      const clamp = (pct) => Math.min(100, Math.max(0, pct));
      const valuePercent = clamp(rawValuePercent);
      const zeroPercent = clamp(rawZeroPercent);
      const styles = getComputedStyle(document.body);
      const accent = (styles.getPropertyValue('--bs-primary') || '#0d6efd').trim() || '#0d6efd';
      const danger = (styles.getPropertyValue('--bs-danger') || '#dc3545').trim() || '#dc3545';
      const neutral = 'rgba(255,255,255,.2)';
      let gradient;
      if (valuePercent >= zeroPercent) {
        gradient = `linear-gradient(90deg, ${danger} 0%, ${danger} ${zeroPercent}%, ${accent} ${zeroPercent}%, ${accent} ${valuePercent}%, ${neutral} ${valuePercent}%, ${neutral} 100%)`;
      } else {
        gradient = `linear-gradient(90deg, ${danger} 0%, ${danger} ${valuePercent}%, ${neutral} ${valuePercent}%, ${neutral} ${zeroPercent}%, ${accent} ${zeroPercent}%, ${accent} 100%)`;
      }
      input.style.background = gradient;
    };

    const renderEqStatus = () => {
      if (!eqStatus) return;
      const bass = formatGain(eqInputs.bass.value);
      const mid = formatGain(eqInputs.mid.value);
      const treble = formatGain(eqInputs.treble.value);
      eqStatus.textContent = `Bass ${bass} · Mid ${mid} · Treble ${treble}`;
    };

    const refreshEqUi = () => {
      Object.entries(eqInputs).forEach(([key, input]) => {
        if (!input) return;
        updateEqTrack(input);
        if (eqValues[key]) eqValues[key].textContent = formatGain(input.value);
      });
      renderEqStatus();
    };

    const ensureContext = () => {
      if (audioCtx) return audioCtx;
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      audioCtx = new Ctx();
      return audioCtx;
    };

    const ensureFilters = () => {
      const ctx = ensureContext();
      if (!ctx || !audioEl) return false;
      if (!sourceNode){
        sourceNode = ctx.createMediaElementSource(audioEl);
        const bass = ctx.createBiquadFilter();
        bass.type = 'lowshelf';
        bass.frequency.value = 200;
        const mid = ctx.createBiquadFilter();
        mid.type = 'peaking';
        mid.frequency.value = 1000;
        mid.Q.value = 1;
        const treble = ctx.createBiquadFilter();
        treble.type = 'highshelf';
        treble.frequency.value = 4000;
        filters = [bass, mid, treble];
        sourceNode.connect(bass);
        bass.connect(mid);
        mid.connect(treble);
        treble.connect(ctx.destination);
      }
      return true;
    };

    const applyEq = () => {
      const ctx = ensureContext();
      if (ctx && ctx.state === 'suspended') ctx.resume().catch(()=>{});
      if (!ensureFilters()) return;
      filters[0].gain.value = Number(eqInputs.bass.value || 0);
      filters[1].gain.value = Number(eqInputs.mid.value || 0);
      filters[2].gain.value = Number(eqInputs.treble.value || 0);
      refreshEqUi();
    };

    Object.values(eqInputs).forEach((input) => input && input.addEventListener('input', applyEq));

    document.querySelectorAll('[data-range-wrapper]').forEach((wrap) => {
      const input = wrap.querySelector('input[type="range"]');
      if (!input) return;
      wrap.querySelectorAll('[data-range-step]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const step = Number(btn.dataset.rangeStep || 0) || 0;
          const min = Number(input.min || 0);
          const max = Number(input.max || 0);
          const current = Number(input.value || 0);
          const next = Math.min(max, Math.max(min, current + step));
          input.value = String(next);
          input.dispatchEvent(new Event('input', { bubbles: true }));
        });
      });
    });
    if (eqPresetFlat) eqPresetFlat.addEventListener('click', () => {
      eqInputs.bass.value = 0; eqInputs.mid.value = 0; eqInputs.treble.value = 0; applyEq();
    });
    if (eqPresetWarm) eqPresetWarm.addEventListener('click', () => {
      eqInputs.bass.value = 3; eqInputs.mid.value = 1; eqInputs.treble.value = -2; applyEq();
    });
    if (eqPresetBright) eqPresetBright.addEventListener('click', () => {
      eqInputs.bass.value = -1; eqInputs.mid.value = 0; eqInputs.treble.value = 4; applyEq();
    });

    refreshEqUi();

    const setAlert = (msg, variant = 'info') => {
      if (!alertEl) return;
      alertEl.hidden = !msg;
      alertEl.className = `alert alert-${variant} d-flex align-items-center gap-2`;
      alertEl.textContent = msg || '';
    };

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    const offlineMessage = 'Mode offline aktif. Audio yang sudah dimuat tetap bisa diputar.';
    window.addEventListener('offline', () => setAlert(offlineMessage, 'warning'));
    window.addEventListener('online', () => {
      setAlert('Koneksi kembali online', 'success');
      setTimeout(() => setAlert('', 'info'), 2200);
    });
    if (!navigator.onLine) setAlert(offlineMessage, 'warning');

    const shareLink = async () => {
      if (!audioSrc) { setAlert('Tidak ada sumber audio untuk dibagikan', 'warning'); return; }
      if (navigator.share){
        try { await navigator.share({ title: trackName, url: location.href }); return; }
        catch (err){ if (err && err.name === 'AbortError') return; }
      }
      try { await navigator.clipboard.writeText(location.href); setAlert('Link player tersalin ke clipboard', 'success'); }
      catch { setAlert(location.href, 'info'); }
    };

    const ensureQrLib = () => {
      if (window.QRCode && typeof window.QRCode.toCanvas === 'function') {
        return Promise.resolve(window.QRCode);
      }
      if (qrLibPromise) return qrLibPromise;
      qrLibPromise = new Promise((resolve, reject) => {
        const onReady = () => {
          if (window.QRCode && typeof window.QRCode.toCanvas === 'function') resolve(window.QRCode);
          else reject(new Error('QR library belum siap'));
        };
        const onError = () => reject(new Error('Gagal memuat library QR'));
        const existing = document.querySelector('script[data-qr-lib]');
        if (existing) {
          existing.addEventListener('load', onReady, { once: true });
          existing.addEventListener('error', onError, { once: true });
        } else {
          const script = document.createElement('script');
          script.src = './vendor/qrcode.js';
          script.defer = true;
          script.dataset.qrLib = 'dynamic';
          script.addEventListener('load', onReady, { once: true });
          script.addEventListener('error', onError, { once: true });
          document.head.appendChild(script);
        }
      }).catch((err) => {
        qrLibPromise = null;
        throw err;
      });
      return qrLibPromise;
    };

    const renderQr = (url) => {
      if (!qrCanvas || !qrWrap) return;
      const ctx = qrCanvas.getContext('2d');
      if (!url) {
        qrWrap.hidden = true;
        if (ctx) ctx.clearRect(0, 0, qrCanvas.width, qrCanvas.height);
        return;
      }
      qrWrap.hidden = false;
      ensureQrLib().then((lib) => {
        if (ctx) {
          const styles = getComputedStyle(document.body);
          const bg = (styles.getPropertyValue('--bs-body-bg') || '#121212').trim() || '#121212';
          ctx.fillStyle = bg;
          ctx.fillRect(0, 0, qrCanvas.width, qrCanvas.height);
        }
        const theme = document.documentElement.getAttribute('data-bs-theme') || 'dark';
        const light = theme === 'dark' ? '#17233f' : '#ffffff';
        const dark = theme === 'dark' ? '#ffffff' : '#1a223d';
        lib.toCanvas(qrCanvas, url, { width: qrCanvas.width || 156, margin: 1, color: { dark, light } }, (err) => {
          if (err && ctx) {
            ctx.fillStyle = '#dc3545';
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('QR gagal', qrCanvas.width / 2, qrCanvas.height / 2);
          }
        });
      }).catch(() => {
        if (!ctx) return;
        ctx.fillStyle = '#dc3545';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('QR gagal dimuat', qrCanvas.width / 2, qrCanvas.height / 2);
        qrWrap.hidden = false;
      });
    };

    if (!audioSrc){
      setAlert('Parameter src tidak ditemukan. Buka halaman ini dari hasil konversi.', 'warning');
      if (titleEl) titleEl.textContent = 'Link tidak valid';
      if (audioEl) audioEl.controls = false;
      renderQr(location.href);
      return;
    }

    const resolvedSrc = new URL(audioSrc, location.origin).href;
    if (audioEl){
      audioEl.src = resolvedSrc;
      audioEl.addEventListener('play', () => { ensureFilters(); applyEq(); });
    }
    if (titleEl) titleEl.textContent = trackName;
    if (metaEl) {
      const metaParts = [];
      if (fmt) metaParts.push(`Format ${fmt.toUpperCase()}`);
      if (Number.isFinite(srParam) && srParam > 0) {
        const kHz = Math.round((srParam / 1000) * 10) / 10;
        metaParts.push(`${kHz % 1 === 0 ? kHz.toFixed(0) : kHz.toFixed(1)} kHz`);
      }
      if (Number.isFinite(chParam) && chParam > 0) {
        metaParts.push(chParam === 1 ? 'Mono' : `${chParam}-Ch`);
      }
      metaParts.push('Streaming siap');
      metaEl.textContent = metaParts.join(' · ');
    }
    renderQr(location.href);
    if (downloadBtn){
      downloadBtn.href = resolvedSrc;
      downloadBtn.download = trackName ? `${trackName}.${fmt || 'mp3'}` : '';
    }
    if (shareBtn) shareBtn.addEventListener('click', shareLink);
    if (copyBtn) copyBtn.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(location.href); setAlert('Link mini player tersalin', 'success'); }
      catch { setAlert(location.href, 'info'); }
    });

    updateEqStatus();
  })();
  </script>
</body>
</html>
